# ========== CORS 白名单（CORS 收窄笔，2026-10-06）==========
# 允许跨源的**字面量** origin 清单（逗号分隔、精确匹配）。装配在 shared/upload/ImgConfig；
# 口径 / 两种「空」的区别 / 为什么只收 origin：见 progress.md §5-AH（本节不另立一份事实）。
#   · 本行的值 = **开发期**（`npm run serve` ⇒ Vue CLI 5 默认 8080；API 基址见 .env.development:3）。
#     ⚠️ `localhost` 与 `127.0.0.1` 是**两个不同的 Origin**，故两个都写。
#   · 生产：**用环境变量整体替换**（等价 `--app.cors.allowed-origins=...`）：
#         APP_CORS_ALLOWED_ORIGINS=https://你的域名
#     ⚠️ 覆盖 = **替换、不是追加** ⇒ 生产不会继承下面这行的 localhost，这正是要的效果。
#   · 空 = 拒绝全部跨源（fail-closed：启动期 WARN，进程照常起）；
#     含空项 / 某项含 `*` = **启动期直接失败**（配置格式错）——两者含义不同，别合并。
#   · 生效值以**启动日志**为准（检索 ASCII 片段 CORS），不靠推断。
app.cors.allowed-origins=http://localhost:8080,http://127.0.0.1:8080
