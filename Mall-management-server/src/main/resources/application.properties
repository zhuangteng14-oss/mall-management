spring.application.name=Mall-management-server
# 项目端口号
server.port=8088
# ========== 数据库连接 ==========
spring.datasource.url=jdbc:mysql://localhost:3306/mall_management_sql?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf-8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========== JPA 配置 ==========
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ========== 文件上传 ==========
# 图片上传目录。默认值为开发期路径（项目内 static/img），开发期无需改动。
# jar 部署时必须由外部覆盖为 jar 外的可写绝对路径，例如：
#   java -jar Mall-management-server.jar --app.upload-dir=/data/mall/img/
app.upload-dir=${user.dir}/src/main/resources/static/img/