spring.application.name=Mall-management-server
# 项目端口号
server.port=8088
# ========== 数据库连接 ==========
spring.datasource.url=jdbc:mysql://localhost:3306/mall_management_sql?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf-8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========== JPA 配置 ==========
spring.jpa.show-sql=true
# ddl-auto：2026-10-04（TD-01，**B 方案**）由 `update` 改为 `validate`。
#   ⚠️ 本笔**只改这一个值**，**不删** spring-boot-starter-data-jpa ——
#      依据是全局硬性约束 2「禁止删除旧接口、旧字段、旧表、旧配置」（agent.md:36），
#      且该约束已被项目**两次**明确套用到这个依赖上（three-layers.md:121、:148 的「保留不删」）。
#
#   【为什么是 `validate` 而不是 `none`】两者都**不会**自动改表（本笔要的就是这条），
#   差别只在「将来有人误加 @Entity」之后：
#     · validate ⇒ 映射与表不符时**启动即失败**（显式炸）；
#     · none     ⇒ 静默通过，要等运行期某条 SQL 报错才暴露 —— 正是本仓 TD-15
#                  「静默 / 断言落空」那一族要防的形态。
#   db-schema.md §3 的原文建议也把 `validate` 列在 `none` 之前。
#   零 @Entity ⇒ 两种取值当前都是空转，本条防的是**将来**。
#
#   ⚠️ 实测（2026-10-04，A3_ENABLED + HikariConfig=DEBUG）：`validate` 与 `update`
#   **启动时机与失败处置完全一致** —— 两者都在启动期建池（`HikariPool-1 - Starting...`），
#   库不可达时都**只记 ERROR、不终止启动**（BUILD SUCCESS）。故
#   application-a3.properties:14-17 与 concurrency-test.md:70 的「不需要额外请求」**依旧成立**。
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ========== 缓存：L1（Caffeine 本地）==========
# 两级缓存的装配见 CacheConfig，设计见 docs/agent/context-packs/cache-layer.md §8。
# 启动时会打印实际生效值（CacheConfig 的「两级缓存已装配」行，可用 ASCII 片段
# "Caffeine(maxSize=" 检索）—— 属性到底有没有被读到，直接从日志取证，不靠推断。
#
# L1 TTL：L1 没有跨节点失效通道（多实例时其他实例的 L1 只能等自己过期），
#   故必须 ≤ spring.cache.redis.time-to-live（默认与 a3 profile 均为 5m），否则陈旧窗口
#   会被放大到 L1 TTL。违反时启动期 WARN（CacheConfig.warnIfL1OutlivesL2）。
app.cache.caffeine.time-to-live=60s
# L1 容量上限。当前无键基数数据，1000 是防御性上界，待 Micrometer 观测后调整；
# 现有接口只产生 1 个缓存键（goodstype::all），远未触及该上界。
app.cache.caffeine.max-size=1000

# ========== 缓存：L2（Redis）条目 TTL ==========
# 不设该值 = CacheConfig.l2Configuration 不进 entryTtl 分支 ⇒ RedisCacheConfiguration 默认
#   Duration.ZERO ⇒ redis-cli 里 TTL 返回 -1（永不过期）：内存无界增长 + 写入后永久陈旧，
#   且 L1（60s）到期后会从 L2 读回那个永不失效的旧值 —— 两级缓存整体退化成「永不过期」。
#   故默认 profile 也必须设，不能只靠 a3。
# 5m 是全局兜底；需要更长/更短的 key 在 @Cacheable 注解侧单独配（见 cache-layer.md §9）。
# 取值必须 ≥ app.cache.caffeine.time-to-live（60s），否则启动期 WARN（CacheConfig.warnIfL1OutlivesL2）。
# 生效值启动期打印：检索 ASCII 片段 "L2 Redis(ttl="（CacheConfig 的「两级缓存已装配」行）。
spring.cache.redis.time-to-live=5m

# ========== 缓存：L2（Redis）探活通道 ==========
# L2 不可达时不是「每次操作都去撞一遍」，而是进冷却窗口：窗口内的 L2 操作直接跳过
# （零网络代价，只读一个 volatile），窗口到期后放**一个**请求去探测。
# 装配见 L2ProbeConfig，状态机见 L2HealthProbe 类注释；
# 启动时打印生效值（检索 ASCII 片段 "L2Probe"），并做一次真实 PING 自检。
#
# 探测超时：必须远短于 spring.data.redis.timeout（a3 为 3s）。主通道冷读在故障端点上实测
#   3.38s（连得上但不回字节）/ 3.40s（SYN 被丢弃），探测若沿用 3s，等于「每 cooldown 秒挑一个
#   请求慢 3 秒」。⚠️ 200ms 是超时**上限**、不是实测耗时：探测实测稳态约 233ms
#   （= 200ms 超时 + 开销），进程内首次约 0.5~0.8s（含 Lettuce 客户端首建与重试）。
app.cache.l2-probe.timeout=200ms
# 冷却窗口：窗口内全部 L2 操作直接跳过；到期后由唯一一个请求同步探测一次
#   （代价见上：稳态约 233ms、进程内首次约 0.5~0.8s；该请求本人也走降级路径，不重试当前操作）。
#   太长 → Redis 恢复后 L2 迟迟不被用上（只有 L1+DB，慢但可用）；
#   太短 → 频繁探测，频繁「每窗口一个请求多付约 0.23s」。
app.cache.l2-probe.cooldown=30s

# ========== 分布式锁（B2：Redisson）==========
# 五个写接口的互斥入口见 DistributedLockService（模板方法 runLocked：争用超时与 Redis 不可达
# 同级，都 fail-open 直行原路径，不新发任何拒绝文案）。
# 客户端**懒建**：首个锁请求才建 Redisson 客户端（构造期零 Redis I/O）；四项 Redisson 超时在
# 类常量里显式调小（connectTimeout=1s / timeout=1s / retryAttempts=1 / retryInterval=200ms），
# 不在此处暴露。锁可用性出口是 gauge mall.lock.up（1=可尝试取锁 0=冷却窗口，⚠️ 0 ≠ Redis 已死）。
# 启动时打印生效值（检索 ASCII 片段 "B2"）。
#
# 取锁等待上限：等待方在 wait 内没抢到就**放弃并回落原路径**（fail-open，不是拒绝）。
#   40 线程同单场景排队量级 ≈ 40 × 3~6ms ≈ 120~240ms，5s 有 20 倍余量 ⇒ 正常不发生超时；
#   真发生属基础设施事件（对 orderAdd 的完整推演见 runLocked 的 javadoc）。
app.lock.wait=5s
# 租期（必须 > wait）：持锁者崩溃时靠它自清，无需人工干预。
#   ⚠️ 临界区跑赢租期 ⇒ 两个线程可能同时进入临界区；探测器是 mall.lock.holds{result=lease_lost}。
#   wait < lease 保证「等待方先放弃，而不是等租约自然到期」。违反时启动期 WARN。
app.lock.lease=10s
# 锁的降级冷却窗口：Redis 不可达时窗口内**不再尝试**取锁（零网络代价，只读一个 volatile），
#   写请求按 fail-open 直行原路径；WARN 与事件只在真实翻转时记一次，窗口内的后续失败不重复记。
#   太长 → Redis 恢复后锁迟迟不被用上（写路径退化为无锁，正确性由各 action 自身的查重兜着）；
#   太短 → 每次失败都要重新花 connectTimeout 量级的时间去撞一个不可达端点。
app.lock.cooldown=30s

# ========== 订单状态异步出口（B3：状态流转时间线）==========
# 一次状态转移搬动的是一行 INSERT，不该让下单/付款请求等它。出口见 OrderStateExecutor
# （显式 ThreadPoolExecutor，**不是 @Async** —— 调用点在锁的 lambda 内，@Async 的同类自调用
# 不经过代理，会静默退化成同步执行）。启动时打印生效值（检索 ASCII 片段 "B3"）。
#
# 核心/最大线程数：负载是低频突发（每单最多 4 次转移），2~4 条线程足够 ——
#   真正的容量缓冲在**队列**上，不在线程数上。
app.order.state.async.core-size=2
app.order.state.async.max-size=4
# 有界队列容量。打满时**丢队首（最旧）**并计数（mall.order.state.async.rejected{reason=queue_full}）
#   —— 时间线是 append-only 的过程记录，最新一条对应「用户正在看的那几个状态」，丢它反而更糟。
#   ⚠️ 明确**不用** CallerRunsPolicy：它会把 INSERT 塞进**订单锁的临界区**，临界区时长随积压增长，
#   租期（app.lock.lease=10s）一旦跑输就是 lease_lost + 两个线程可能同时在临界区 ——
#   用一个有界、被计数的丢弃去换一个不可观测的正确性风险，不划算。
#   1024 对 A3 的 20~40 并发有三个数量级余量 ⇒ 场景里 async.rejected 应恒为 0。
app.order.state.async.queue-capacity=1024
# 关闭时等待在途任务落库的上限；超时后放弃剩余任务并 WARN。
#   ⚠️ 放弃的只是**流转记录**，状态位本身已在 order 表里提交，不受影响。
app.order.state.async.shutdown-timeout=10s
# 时间线总开关。关闭时**不投递**任何落库任务（指标 transitions{result=applied} 照记）——
#   在时间线落库成为热点、或 order_state_transition 尚未建表时，可先关掉而不必重新部署。
#   ⚠️ 正因为有它，「投递数 ≡ transitions{result=applied}」这个等式**只在开启时**成立，
#   所以本值必须在启动期打印出来（见 OrderTransitionRecorder）—— 否则
#   mall.order.state.async.submitted 为什么没埋就成了说不清的事（规范第 6 条）。
app.order.state.timeline.enabled=true

# ========== 可观测性（Actuator + Micrometer，C1）==========
# 暴露 health 与 metrics，**所有 profile 都开**：本地与 CI 的验收都要能直接取到指标
#   （curl /actuator/metrics）。这两个端点只读进程内状态，不碰业务数据、不写库。
# 指标口径（命名规范 + 清单 + 事件语法）见 MallCacheMetrics 类注释 —— 唯一出处。
management.endpoints.web.exposure.include=health,metrics
# 关掉 Redis 健康指示器。两条理由，都不是风格问题：
#   ① 它是**第二条探测通道**：指示器每次被轮询就 PING 一次，绕过 L2HealthProbe 的单飞与
#      冷却窗口 —— 等于在「每 cooldown 秒只放一个请求探测」的机制旁边另开一条探测路径；
#   ② 语义错误：Redis 不可达是**设计上刻意容忍**的降级态（L1 + 直接回落 DB，见
#      cache-layer.md §9 的降级断言），报 DOWN 会让 /actuator/health 在「系统其实正常
#      服务中」时变红。
#   L2 状态改由 gauge 暴露：mall.cache.l2.up（1=可用 0=处于冷却窗口，⚠️ 0 ≠ Redis 已死）。
management.health.redis.enabled=false

# ========== 文件上传 ==========
# 图片上传目录。默认值为开发期路径（项目内 static/img），开发期无需改动。
# jar 部署时必须由外部覆盖为 jar 外的可写绝对路径，例如：
#   java -jar Mall-management-server.jar --app.upload-dir=/data/mall/img/
app.upload-dir=${user.dir}/src/main/resources/static/img/

