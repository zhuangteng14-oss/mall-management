# ========== CORS 白名单（CORS 收窄笔，2026-10-06）==========
# 允许跨源的**字面量** origin 清单（逗号分隔、精确匹配）。装配在 shared/upload/ImgConfig；
# 口径 / 两种「空」的区别 / 为什么只收 origin：见 progress.md §5-AH（本节不另立一份事实）。
#   · 本行的值 = **开发期**（`npm run serve` ⇒ Vue CLI 5 默认 8080；API 基址见 .env.development:3）。
#     ⚠️ `localhost` 与 `127.0.0.1` 是**两个不同的 Origin**，故两个都写。
#   · 生产：**用环境变量整体替换**（等价 `--app.cors.allowed-origins=...`）：
#         APP_CORS_ALLOWED_ORIGINS=https://你的域名
#     ⚠️ 覆盖 = **替换、不是追加** ⇒ 生产不会继承下面这行的 localhost，这正是要的效果。
#   · 空 = 拒绝全部跨源（fail-closed：启动期 WARN，进程照常起）；
#     含空项 / 某项含 `*` = **启动期直接失败**（配置格式错）——两者含义不同，别合并。
#   · 生效值以**启动日志**为准（检索 ASCII 片段 CORS），不靠推断。
app.cors.allowed-origins=http://localhost:8080,http://127.0.0.1:8080

# 【app.sql.slow-ms】C3 块 7 · commit 6b（慢 SQL 告警，批文 Q4 的「丁」，2026-10-14）
# 一条语句跑够这个毫秒数，就在**请求线程**上打一行 WARN（带 traceId），由 SlowSqlConfig 把
# DataSource 包一层装上。
# ⚠️ 置 0 或负数 = **整条链路不装**（不是「阈值设 0 所以每条都报」）—— 那会让每个 JDBC 调用
#    少一层动态代理。a3 profile 就是这么关的，理由见 application-a3.properties 末尾。
# ⚠️ 本行**追加在文件末尾**是刻意的：本文件被若干处按「文件:行号」引用（如 MallCacheMetrics.java:65
#    引 application.properties:24、application-a3.properties:90 引本文件 :124），中间插行会让
#    那些引用集体偏移。追加则一个都不动。
# ⚠️ 改数值前先读 SlowSqlConfig 类注释：包装发生在「初始化之后」、绕开 Boot 的 DataSource 装配，
#    是有意的取舍（保住 spring.datasource.hikari.* 的绑定）。
app.sql.slow-ms=200

# 【management.health.rabbit.enabled=false】C3 块 7 · commit 8c（事件台账出口，2026-10-14）
# 关掉 RabbitMQ 健康指示器 —— 与上面 `management.health.redis.enabled=false` **同族、同两条理由**，
# 不重复论证，只写「不同在哪」：
#   ① 它是**第二条探测通道**：指示器每次被轮询就握一次手，绕过 EventPublisher 那个 5s 单线程探针的
#      闸门 —— 等于在「一条可持续解释的连通性判据」旁边另开一条，页面上的黄点与实际发布路径脱钩；
#   ② 语义错误：**broker 不在是设计上刻意容忍的降级态**（契约 = fail-soft：事件丢了不拖业务请求，
#      见 EventPublisher 接口注释），报 DOWN 会让 /actuator/health 在「系统其实正常服务中」时变红。
#      a3 profile 连 broker 都没有，这一条在 CI 里**必然**命中。
#   ⇒ 连通性改由帧里的 `mq` 字段暴露（EventStreamService 从 EventPublisher.connected() 读，实时日志页画那个点）。
# ⚠️ 本行**追加在文件末尾**是刻意的（同上面 app.sql.slow-ms 那段：本文件被多处按「文件:行号」引用，
#    中间插行会让那些引用集体偏移）。
management.health.rabbit.enabled=false

# 【spring.mvc.async.request-timeout=-1】C3 块 7 · commit 10（观测流长连接，2026-10-15）
# 块 7 的三条观测流（/admin/observe/{metrics,orders,events}/stream）走的是 Spring MVC 的
# **异步返回路径**（`StreamingResponseBody`），因此受**容器异步超时**管：Tomcat 的异步请求默认
# 30 秒到时，`AsyncRequestTimeoutException` 一发，这条流就在**推帧推到一半**时被容器掐掉。
#   而这三条流的语义恰恰是「**一直推**」（`mall.observe.sse.max-ticks` 默认 0 = 无限），
#   演示时一条流挂几分钟是常态 ⇒ 不关掉这一层，流会在一个**看起来毫无理由的时刻**断掉，
#   而页面只会看到「不动了」（前端重连/断线提示是 commit 10 的 10c，见 EventLog.vue 等三页）。
# 取值：**-1 = 本层不设超时**（Tomcat 侧 `asyncTimeout <= 0` 即不超时）。不用「一个很大的数」：
#   那只是把同一件事推到更远的地方，且读代码的人无法判断那个数是「够用」还是「随手写的」。
# 证据链（2026-10-15 就地取证，不是推断）：
#   ① 属性存在与语义 —— spring-boot-autoconfigure-3.4.5.jar 的 spring-configuration-metadata.json：
#      `spring.mvc.async.request-timeout | java.time.Duration | Amount of time before asynchronous
#       request handling times out. If this value is not set, the default timeout of the underlying
#       implementation is used.`（「underlying implementation」= 容器，Tomcat 的 `asyncTimeout` 默认 30s）
#   ② 它**确实管到本路径**（`StreamingResponseBody`）—— spring-webmvc-6.2.6.jar 字节码：
#      `AsyncSupportConfigurer.setDefaultTimeout(long)` 收下 → `RequestMappingHandlerAdapter
#      .asyncRequestTimeout` → `invokeHandlerMethod` 里 `AsyncWebRequest.setTimeout(asyncRequestTimeout)`，
#      这一句在**派发到任何返回值处理器之前**执行 ⇒ 与返回类型无关，本块三条流都受它管。
# ⚠️ 关掉本层**不等于**流永不结束 —— 终止权仍然在别处，且都在明面上：
#   ① `mall.observe.sse.max-ticks > 0` ⇒ 推满即主动结束（自动化测试用的「抓一帧就够」口子）；
#   ② 客户端断开 ⇒ 写已关闭的输出流抛 IOException，`SseStreamWriter` 当场收工（不重试）；
#   ③ 服务端关停 ⇒ 线程被中断，同样收工。
# ⚠️ 代价如实记：本值让「一个客户端挂着不读」的连接**由容器一直留着**。本块的连接数是
#   「几个页面」（≤4），不是「几个请求」，故这个代价可控；若将来观测流对外开放，这条要重新评估。
# ⚠️ 本行**追加在文件末尾**是刻意的（同上面两段：本文件被多处按「文件:行号」引用）。
spring.mvc.async.request-timeout=-1

# ============================================================================================
# D 段「防护加固」· commit 2 —— 熔断（Resilience4j）与线程池分池的唯一配置处
# ============================================================================================
# ⚠️ 【本段开关的真实口径：4 键接闸 + 1 键记录位】（阶段 2b 起；此前是 3 键接闸 + 1 键登记 TD）
#     接闸  rateLimit（入站限流，阈值在 ProtectConfig 的常量里）/ circuitBreak（下面两行）/
#           poolIsolation（本段末）/ retry（死锁重试，落点在 MerchantDowngradeService.relist）
#     ⚠️ 重试的**次数与退避不在这里**：那三个数写死在 MerchantDowngradeService 的常量里
#     只记录 degrade    —— 系统固有 fail-open，不由开关管
#     ⚠️ 别把上面这句写成「5 键已接闸」或「retry 还没落码」。口径唯一代码出处是 `ProtectionGate.WIRED_KEYS`。
#
# 【熔断：两个实例，都挂在 MySQL 这一条下游上，按「读 / 写」分开】
#   为什么按读写分开：演练灌的是**读**（商品页 / 搜索是 seckill、cacheCold 两个场景的主战场），
#   而写要保住。分开之后「读被熔断打开时写仍能过」是**可演示**的收益，
#   合成一个实例就没有这个区分了。
#   为什么不挂订单 / 支付就完事：不允许（用户 2026-10-15 裁定逐字「禁止只挂订单、支付」）。
#   本段的落点跨域 —— 商品（GoodsService）与订单（OrderService.orderAdd），且读 / 写都有。
#   ⚠️ 为什么不挂 Redis / MQ：那两条**本仓已经各有一处手写熔断**，
#     再加一个 r4j 的会是重复造（RabbitEventPublisher 的 `connected` 闸 + 探测线程 = 短路 + 半开；
#     DistributedLockService 的 cooldown 窗口 = 同类）。见 tech-debt.md 的登记。
#
# 【切面顺序：实测，不是声明】CircuitBreakerAspect.getOrder() 的默认值是 2147483643
#   （=Integer.MAX_VALUE-4，2026-10-15 从 resilience4j-spring6-2.3.0.jar 的常量池读出），
#   而 Spring 事务切面是 Ordered.LOWEST_PRECEDENCE(=Integer.MAX_VALUE) ⇒ **熔断在外、事务在内**：
#   熔断开路时连事务都不会开（不占连接、不回滚）。⚠️ 这条是取值实测，别靠「应该在外层」。
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.sliding-window-type=TIME_BASED
# ⚠️ TIME_BASED 下 sliding-window-size 的单位是**秒** ⇒ 30 = 批文点名的「30s 窗口」。
resilience4j.circuitbreaker.configs.default.sliding-window-size=30
# 最小请求数：批文点名要有。没有它，低流量时一次偶发超时就能把熔断打开（误熔断）。
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=20
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true
# 慢调用也算失败：本仓多数下游是 fail-soft（不抛只是慢），只看异常率的话
# 「MySQL 被打满、每条查询 3 秒」这件事在熔断眼里等于「一切正常」。
resilience4j.circuitbreaker.configs.default.slow-call-duration-threshold=1s
resilience4j.circuitbreaker.configs.default.slow-call-rate-threshold=50
# 入参形状错误（IllegalArgumentException）不是下游故障，不计入熔断 —— 否则「用户填错一个参数」
# 会跟「MySQL 挂了」记在同一格里。
resilience4j.circuitbreaker.configs.default.ignore-exceptions=java.lang.IllegalArgumentException
# ⚠️ 【两个实例名刻意不在本文件里再写一遍】`mallMysqlRead` / `mallMysqlWrite` 这两个名字
#    只在 `@CircuitBreaker(name=…)` 的注解上出现（GoodsService / OrderService），而它们**不需要**
#    自己的一段参数 —— 上面 `configs.default.*` 就是所有实例的默认配置。
#    在这里多写一遍 `instances.*.base-config=default` 只会多一个「配置里有一份、注解里又一份」的双写。

# 【MQ 消费池：分池的第 3 个池】RabbitObserveConfig 的工厂用 Boot 的 configurer 打底
#（`configurer.configure(factory, connectionFactory)`）⇒ 这两行**经属性生效**，不用改那个 Java 类。
# ⚠️ 2026-10-19 性能隔离：消费者改用**独立 Hikari 池**（4 条，见 ObserveDataSourceConfig），
#   并发数同步由 2/8 收成**固定 4/4**。四条消费者各占一条连接，不会再有第 5 条去抢业务主池；
#   固定而不浮动，是为了「线程数 = 池大小」能一眼对上（浮到 8 只会在池外排队等连接）。
#   不设得更大是因为下游是同一条 MySQL，且业务池只有 10 条（本段不优化慢 SQL —— 那是硬边界）。
spring.rabbitmq.listener.simple.concurrency=4
spring.rabbitmq.listener.simple.max-concurrency=4

# 【D3 攻防联动：演练注入的真实落点（2026-10-18）】
# 这四个键是**演示用**的运行时延迟 / 上限，不是业务参数。改完重启后端生效。
#
# dbSlow：每条 SELECT 注入的延迟（ms）。写路径（INSERT/UPDATE/DELETE）**不延迟**；
#   攻击控制端点 /admin/observe/attack/** 也不延迟（否则打开开关的动作自己被拖慢）。
#   生效前提是 app.sql.slow-ms > 0（a3 里是 0 ⇒ a3 不演示 dbSlow，见批文裁定 4）。
mall.observe.injection.db-slow-ms=120
# dbSlow：单个请求的延迟总预算（ms）。代码里另有一道硬上限 300（需求裁定逐字「每请求最多 300ms」）。
mall.observe.injection.db-slow-budget-ms=300
#
# SSE 连接上限（分角色，2026-10-18 用户裁定）：防止演示时开十几个标签页把后端连接池 / 线程占满导致白屏。
# 超限返回 429 + 提示；数值写在这里是为了现场能直接改，不用改代码。
# ⚠️ 单用户身份 = 登录 userId；未登录（dev/a3 的 app.auth.enabled=false）时按客户端 IP 计，
#    且**一律归入普通用户档**（角色号 role=3 才是管理员档）。
# 普通用户 / 商家：单账号 20 条，本档全局 200 条（严格限制）。
mall.observe.sse.max-per-user=20
mall.observe.sse.max-total=200
# 管理员：单账号 500 条，本档全局 2000 条。⚠️ 两档全局名额**互相独立**：
# 普通用户占满 200 不会让管理员 429，反之亦然。
mall.observe.sse.admin.max-per-user=500
mall.observe.sse.admin.max-total=2000

# ========== 2026-10-19 性能隔离：双连接池 / 双淘汰（追加在末尾，理由同上） ==========
# 【业务主池】显式钉成 10 —— 与 Hikari 默认值相同；写出来是为了给下面「消费池 4」一个
# 可对照的基数，也避免将来默认值变化时口径漂移。该前缀由 ObserveDataSourceConfig 的
# `@ConfigurationProperties("spring.datasource.hikari")` 绑定到 business-pool。
spring.datasource.hikari.maximum-pool-size=10
# 【可观测消费者独立池】前缀不是 spring.datasource ⇒ 只由 ObserveDataSourceConfig 绑定。
# 消费者 DAO（ObservedEventConsumer 注入的 observeConsumerObservedEventDao）只认这个池，
# 后台事件写入从此不再与业务请求抢那 10 条连接。
mall.observe.consumer.hikari.maximum-pool-size=4
mall.observe.consumer.hikari.minimum-idle=1
mall.observe.consumer.hikari.connection-timeout=10000
# 【双淘汰】保留期管「太旧」，水位管「太多」；两者都用
# `DELETE ... ORDER BY Id LIMIT ?` 分批删，批间睡 batch-pause-ms 毫秒 ——
# 绝不把几十万行塞进一个事务里长时间锁表。
mall.observe.cleanup.attack-retention-days=3
mall.observe.cleanup.normal-retention-days=3
mall.observe.cleanup.high-watermark=300000
mall.observe.cleanup.target-watermark=250000
mall.observe.cleanup.batch-size=5000
mall.observe.cleanup.batch-pause-ms=100

# ========== 2026-10-20 中间件本地化（feat/env-local-vite，追加在末尾） ==========
# 默认 profile = 全本地：MySQL 已在文件顶部（localhost/root），这里补 Redis 与 RabbitMQ。
# 口令用「环境变量 + 本地默认值」的写法（同 dev/a3），避免在 diff 里新增明文口令。
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD:123456}
spring.data.redis.timeout=3s

# RabbitMQ：本地新装 broker 的默认账号是 guest/guest（guest 只允许 loopback 登录，
# 后端与 broker 同机 ⇒ 可用）。
# ⚠️ 放在全局意味着 a3 profile 也会继承 host ⇒ 消费端 bean 在 a3/CI 里**会存在**；
#    CI 的 runner 上没有 broker，靠 application-a3.properties 末尾的
#    spring.rabbitmq.listener.simple.auto-startup=false 关掉监听容器（不改 CI 脚本）。
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${MALL_MQ_USERNAME:guest}
spring.rabbitmq.password=${MALL_MQ_PASSWORD:guest}
