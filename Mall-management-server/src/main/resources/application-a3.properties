# ============================================================
# A3 并发测试 profile —— 后端指向独立 MySQL 实例
# 用法：SPRING_PROFILES_ACTIVE=a3
# ============================================================
#
# 【为什么必须是「独立实例 + 同名库」，而不是「切库名」】
#   MallManagementGoodsController(23 处) 与 MallManagementUserController(16 处)
#   的 SQL 硬编码 schema 限定名 `mall_management_sql.`（合计 39 处，见 TD-13），
#   MallManagementMessage 则 0 处。切库名无法把前两者的读写切走，且 /message/*
#   会跟随 datasource，同一进程内脑裂。故隔离只能靠独立实例 + 保留同名库。
#
# ⚠️ 日志确认的时机（2026-09-20 更正）：原写「Hikari 是懒初始化，配置块在第一次
#    getConnection() 时才打印，服务启动日志里没有 —— 必须先打一个请求」——该判断是错的。
#    本项目启动期 Hibernate 初始化即触发连接，HikariConfig 块在 Tomcat started【之前】
#    已打印，【不需要额外请求】，直接 grep HikariConfig 即可看到实际 jdbcUrl。
#    保留「先打一个请求」作为备用路径：若按 TD-01 移除 spring-boot-starter-data-jpa
#    （全部数据访问走 JdbcTemplate），Hikari 不再被 Hibernate 触发，那一步才真的需要。

spring.datasource.url=${A3_DB_URL:jdbc:mysql://192.168.229.129:3306/mall_management_sql?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf-8}
spring.datasource.username=${A3_DB_USER:test}
spring.datasource.password=${A3_DB_PASSWORD:test123}

# 打印实际生效的 jdbcUrl（用于确认「后端确实连的虚拟机」第 1 层；如上，启动日志里就有，
# 不需额外请求。仅在需要核对该行时开着，核对完可关）
logging.level.com.zaxxer.hikari.HikariConfig=DEBUG

# Redis（VM 上，见 environment.md）
# 口令沿用本文件既有约定（占位符 + 默认值），默认值与 environment.md 记录一致
spring.data.redis.host=192.168.229.129
spring.data.redis.port=6379
spring.data.redis.password=${A3_REDIS_PASSWORD:123456}
spring.data.redis.timeout=3s
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=4
spring.data.redis.lettuce.pool.min-idle=1

# 缓存项默认 TTL。不设 = RedisCacheConfiguration 用 Duration.ZERO = 永不过期（TTL -1），
# 后果是内存无限增长 + 数据永久陈旧。5m 是全局兜底；需要更长/更短的 key 在
# @Cacheable 注解侧单独配（见 cache-layer.md §9）。
spring.cache.redis.time-to-live=5m

# 上传目录外置到临时目录（属「环境路径」，非被测参数，故改它不影响被测性）
#   - 目录会在启动时自动创建：ImgPath.initUploadDir() 的 @PostConstruct 调用
#     Files.createDirectories(uploadPath)（ImgPath.java:23-27），无需手动 mkdir。
#     若创建失败会抛 IOException 使 Bean 初始化失败——即「启动期炸」，不会静默。
#   - 但本项与 ddl-auto / 池大小不同：后两者是被测参数（不许改），本项只是路径。
#   - A3 场景只走 order 系列（Images 为字符串入参，不落盘），本目录在 A3 期间
#     不会被写入；外置属防御性隔离，确保 a3 profile 在任何情况下都不写仓库目录（TD-08）。
#   - 本 profile 只覆盖目录，不改 TD-06 的 URL 前缀硬编码——那是被测现状的一部分。
app.upload-dir=${java.io.tmpdir}/a3-uploads/

# ============================================================
# 明确禁止项（勿在本 profile 中启用）
# ============================================================
#
# 1. 禁止 spring.jpa.hibernate.ddl-auto=create / create-drop
#    理由：会 DROP 全部 11 张表。A3 依赖「导入一次、干净复用」，清库只能走脚本的
#    --reset-db（显式、opt-in、仅 VM/CI），绝不靠启动时自动建表。
#    同时【刻意不显式设置 ddl-auto】：继承 application.properties 的 `validate`
#    以保持被测配置与真实运行一致（TD-01 已确认无 @Entity，该设置当前为空转）。
#    ⚠️ 原文写「继承…的 `update`」；2026-10-04（TD-01，B 方案）把那个值改成了 `validate`，
#       本行随之订正 —— **本 profile 一行未动**（仍靠继承，不显式设置）。
#       实测同日：`validate` 与 `update` 都**在启动期建池**、库不可达时都不终止启动，
#       故上方「日志确认的时机」一节（:14-17）**不需要改**。
#
# 2. 禁止在本 profile 中调整 Hikari 连接池参数（maximum-pool-size 等）
#    理由：本项目未配置池大小，默认值 10 本身就是 A3 的被测对象之一；
#    调大池会掩盖并发争用，使 B 组缺陷复现率下降甚至消失。
#    要改池大小必须先把它登记为独立的测量变量，而不是顺手写进 profile。
#
# 3. 禁止把 A3_DB_URL 的默认值指向开发机（localhost / 127.0.0.1）
#    理由：本地 MySQL 与虚拟机同名库，仅主机可区分；默认值指错会让 A3
#    静默跑在开发库上——脚本侧 --expect-db-host 校验正是为此设的最后一道闸（exit 2）。
#
# 【安全提醒】本文件含明文默认口令，且随 jar 一起分发。仓库转公开前必须与
# environment.md 中记录的 git 历史清理一并处理（见 environment.md 安全提醒一节）。
