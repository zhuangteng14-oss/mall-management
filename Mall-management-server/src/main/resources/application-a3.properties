# 【spring.rabbitmq.*】**本 profile 刻意一行都不配**（C3 块 7 · commit 8c，2026-10-14）。
# ⚠️ 「不写」在这里是**结论**，不是遗漏 —— 写下来省得下一个人以为是漏配。
# ① CI 的 concurrency job（`SPRING_PROFILES_ACTIVE=a3`）里**没有 broker**：ci.yml 的 services
#    里那一格 `rabbitmq:3-management` 是为了「同一族风险的下一次」提前就位，今天并不被真正用上
#    （guest 只许从容器内 localhost 登录，而客户端来自 docker 网桥 ⇒ 认证被拒）。**空转 ≠ 有害**。
# ② 客户端于是按 Boot 默认连 localhost:5672。⚠️ **发布侧与消费侧在这里分道扬镳**：
#    · **消费侧**（`ObservedEventConsumer`）带 `@ConditionalOnProperty(prefix = "spring.rabbitmq",
#      name = "host")` ⇒ 本 profile 没配 host ⇒ **那个 bean 根本不存在** ⇒ 没有任何监听器容器
#      ⇒ 「凭据错 ⇒ 启动期致命」（`FatalListenerStartupException`）在 CI 里**无从发生**。
#      依据是两条实测：不配 host 那次（消费者 bean 不在）起得来；空口令那次（配了 host、消费者在）
#      起不来，且致死栈穿过的正是监听器注册表。⚠️ **「a3 + CI 里有 broker」这个组合本身没在本地
#      实测**（本地造不出「localhost:5672 上有 broker 且拒 guest」而不引入 host 属性的情形），
#      它是由上面两条**组合推得**的。
#    · **发布侧**（`RabbitEventPublisher`）是**无条件**注册的 ⇒ 探针每 5 秒试一次 localhost:5672，
#      连不上或被拒都只记 WARN（首条 + 之后每 5 分钟一条），业务请求照走（契约 fail-soft：
#      **没有台账不能把请求拖红**）。这正是 A3 想要的姿态 ——「MQ 缺席时门禁数字不变」这件事
#      **必须**在 CI 里是真的，不能靠本地有 broker 掩盖。
#      ⚠️ 所以 CI 日志里**会**看到 `[EVENT] MQ 不可达`：那是预期噪音，不是门禁异常。
# ③ 与 dev 的差异见 application-dev.properties 末尾那一段（那边配了 host/端口/用户/占位符口令）。
