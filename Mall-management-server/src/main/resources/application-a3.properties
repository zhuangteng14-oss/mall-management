# 【app.sql.slow-ms】C3 块 7 · commit 6b（2026-10-14）—— 本 profile **关闭**慢 SQL 包装。
# ⚠️ 与上面几行**不是同一族**：那些关的是「会自己醒来的东西」（后台线程 ⇒ 给压测注入变量），
#    本行关的是「每条 SQL 外面多一层动态代理」——那是**给门禁数字本身**加噪声：A3 的验收标准是
#    120 QPS（CI 同机实测 119.9，余量不到 1%），datasource-proxy 的每调用开销正好落在这条线上。
#    而慢 SQL 告警是**运维观测**，不是 A3 的验收项 ⇒ 在这里关掉，不拿门禁余量去换它。
# ⚠️ 语义：0 = **整条链路不装**（数据源保持 Boot 原样），不是「阈值 0 所以每条都报」——
#    装配点 SlowSqlConfig 判的是 `slowMs <= 0`。（这一条是「A3 槽位」的登记：ConcurrencyRunner
#    **不用改**，已核它对响应头与日志输出零断言；这里动的是装配开关，不是它的代码。）
app.sql.slow-ms=0

