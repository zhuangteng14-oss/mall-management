# ============================================================
# dev profile —— 日常开发 / 手验 / 攻击模拟器（后端指向 VM 实例，job 全开）
# 用法：SPRING_PROFILES_ACTIVE=dev
# ============================================================
#
# 【为什么要有它（2026-10-11）】
#   原先只有一个 a3 profile 同时服务两件需求**互斥**的事：
#     · CI 的 A3 并发门禁 —— 要求「会自己醒来的东西」全关（同一份输入 → 同一份结果）；
#     · 日常开发 / 手验      —— 要求 job 全开（否则物流轨迹 / 超时取消这
#       类功能**根本看不到**，用户 2026-10-10 就这么报了「物流轨迹不更新」）。
#   ⇒ 拆成两个 profile：**a3 = CI 专用（job 全关，一字不动）**；**dev = 日常（job 全开）**。
#
# 【dev 与 a3 的关系：孪生，差别只有 job 开关（+ 两处命名）】
#   本文件 = application-a3.properties 的复制，逐项相同，改动仅：
#     ① 三个「会自己醒来的东西」的开关 false → **true**（本 profile 的核心目的）；
#     ② env 变量前缀 A3_ → DEV_（避免在 dev profile 里读到 A3_ 的旧值，语义也更直）；
#     ③ 上传目录 a3-uploads/ → dev-uploads/（同一个「临时目录」约定，只是名字不再撒谎）。
#   ⚠️ 为什么是「复制」而不是「include a3」：Boot 的 spring.profiles.group.dev=a3 会把 a3
#      排在 dev **之后**，后加载者赢 ⇒ a3 的 job=false 反而**盖住** dev 的 job=true；
#      反过来 group.a3=dev 又会让 CI 的 a3 也吃到 job=true。分组方向在此是反的，**复制才对**。
#   ⚠️ 代价：a3 的「连库 / Redis / TTL / 池」将来若变，本文件**不会自动跟** —— 改 a3 的这几项
#      必须同步改这里。已登记 tech-debt.md。
#
# 【为什么不是「直接开 a3 的 job」】
#   A3 门禁断言「120 QPS 下每单恰好 1 次成功」这类**确定性**结论；job 每 15 秒自己醒来扫库
#   改状态，会让基线混进一个与压测无关的变量 ⇒ 断言可能假红 / 假绿，**门禁失去可信度**。
#   故 a3 必须保留 job 全关 —— dev 是另一条线，不共用。
#
# ============================================================
# 以下各行与 application-a3.properties 逐项对齐（除上述 ①②③）
# ============================================================

# 连本地实例（2026-10-20 起；原 VM 192.168.229.129 已停用）。库名仍为 mall_management_sql
# （TD-13：39 处 SQL 硬编码 schema 前缀，切库名切不走）。dev 用 test/test123，与默认 profile 的
# root/123456 指向同一个 mysqld、同一个库，仅账号不同。
spring.datasource.url=${DEV_DB_URL:jdbc:mysql://localhost:3306/mall_management_sql?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf-8}
spring.datasource.username=${DEV_DB_USER:test}
spring.datasource.password=${DEV_DB_PASSWORD:test123}

# 打印实际生效的 jdbcUrl（启动日志里就有；日常用来确认「后端确实连的 VM」那一层）
logging.level.com.zaxxer.hikari.HikariConfig=DEBUG

# Redis（本地，2026-10-20 起；原 VM 已停用）
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=${DEV_REDIS_PASSWORD:123456}
spring.data.redis.timeout=3s
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=4
spring.data.redis.lettuce.pool.min-idle=1

# 缓存项默认 TTL。不设 = RedisCacheConfiguration 用 Duration.ZERO = 永不过期（TTL -1），
# 后果是内存无限增长 + 数据永久陈旧。5m 是全局兜底；需要更长/更短的 key 在 @Cacheable 侧单独配。
spring.cache.redis.time-to-live=5m

# 上传目录外置到临时目录（目录启动时自动创建：ImgPath.initUploadDir() 的 @PostConstruct）。
# dev 与 a3 一样外置，确保本 profile 任何情况下都不写仓库目录（TD-08）。
app.upload-dir=${java.io.tmpdir}/dev-uploads/

# ============================================================
# 明确禁止项（与 a3 同款，勿在本 profile 中启用）
# ============================================================
#
# 1. 禁止 spring.jpa.hibernate.ddl-auto=create / create-drop
#    （会 DROP 全部表；建表只走 mall_management_sql.sql 的迁移块）
#    本文件与 a3 一样**刻意不显式设置它** ⇒ 继承 application.properties 的 `validate`。
# 2. 禁止把 DEV_DB_URL 的默认值指向开发机（localhost / 127.0.0.1）—— 同 a3 的禁止项 3。
#
# 【安全提醒】本文件含明文默认口令（与 a3 同源，见 environment.md 安全提醒一节）。

# ============================================================
# 鉴权闸在本 profile 显式关闭（与 a3 孪生，2026-10-11）
# ============================================================
#
# ⚠️ 语义：本 profile 是**日常开发**用，鉴权闸关着 ⇒ **日常手验 ≠ 生产鉴权行为**。
#    「手验绿」只覆盖业务逻辑，不覆盖「闸开着时会不会 401」。
#    要验鉴权本身，用 application.properties 的默认 profile（app.auth.enabled=true）。
# ⚠️ 为什么显式 false 而不是靠继承：主配置 application.properties 的 app.auth.enabled=true
#    （翻开关笔，2026-10-05）⇒ 靠继承会把 5 个非白名单端点 + /actuator/metrics/** 全变 401。
#    同 a3，见 application-a3.properties:98 那一段的完整理由。
app.auth.enabled=false

# ============================================================
# 【本 profile 的核心】三个「会自己醒来的东西」全开
# ============================================================
#
# 与 a3 **逐项相反**：a3 全 false（压测确定性），dev 全 true（功能可见）。
# ⚠️ 默认值本就是 true（@ConditionalOnProperty(matchIfMissing=true)）⇒ 这里**显式写 true**
#    不是为了打开，而是为了「dev 与 a3 的 diff 恰好是这四行」（downgrade / shipping.track /
#    cancel / stats 四个 job 开关）这件事**肉眼可核**。

# 商家降级的到期执行（MerchantDowngradeJob 的 @Scheduled 扫描；阶段 ③ 自动执行）
mall.downgrade.job.enabled=true

# 物流轨迹推进（ShippingTrackAdvanceJob 的 @Scheduled 扫描）
# 演示节奏：扫描间隔 15s；节点 15/30/45/60 秒（发货后依次 运输中/驿站已揽收/驿站派送中/已签收）
mall.order.shipping.track.enabled=true

# 订单超时未付款自动取消（OrderTimeoutCancelJob 的 @Scheduled 扫描）
# 演示阈值：60 秒未付款即取消（mall.order.cancel.timeout-ms 默认 60000 / 扫描 15s）
mall.order.cancel.enabled=true
# 是否跳过「演练带标记的行」（C3 块 7 · commit B · ② /《块 7 参考》§1.4 C2 甲）
#   false（**dev 默认**）= 与加这个开关之前逐字节同行为：所有未付款超时的单一律照取消（含演练造的 SIM- 单）。
#   true            = 带标记的候选整个不进本轮：不取消、也不回补库存。
# ⚠️ 标记 = OrderId 前缀 SIM- 或 order.Source='attack'（见 OrderTimeoutCancelJob.isAttackData）。
# ⚠️ 这是**演示开关**、不是新常态：本类的主职责是「超时未付款就取消」，置 true 会让它对带标记的单不成立。
#    参考文要的是「一半数据被 job 拦截 / 一半跳过 job 注入」这个**对照**，对照要手工开。
mall.order.cancel.skip-attack-data=false

# 经营数据滚动预聚合（StatsAggregateJob 的 @Scheduled 扫描）
# ⚠️ 它**算不到演示数据**：窗口是「最近 3 天」（mall.stats.job.window-days），而种子订单在 2026-05…10
# ⇒ 每轮扫 0 行是正常的。要看历史数据请打 `POST /admin/stats/rebuild`（看板页上有那枚按钮）。
mall.stats.job.enabled=true

# 事件台账保留期清理（ObservedEventCleanupJob 的 @Scheduled 扫描；块 7 · commit 8b，2026-10-14）
# ⚠️ 本行的**实际效果**要到 8c 之后才看得见：observed_event 的**写入方**（RabbitMQ consumer）
#    是 8c 的活（用户 2026-10-14 裁决「8b 只建表 + 清理」）⇒ 本笔跑起来表是空的、每轮删 0 行。
#    留 true 是为了不破坏上面那句「dev 与 a3 的 diff 恰好是这几个 job 开关」的肉眼可核性
#    ——**别**为了「反正删 0 行」把它写成 false，那会让 dev 与 a3 的 diff 里多出一条无法解释的行。
# 保留期两档（3 天攻击批次 / 30 天日常）**不写在本文件里**：默认值在
#    ObservedEventCleanupService 的两个 @Value 注解上，与既有 mall.order.cancel.timeout-ms 同款处置
#    （默认值就地可读，漏配一个 profile 时行为仍确定）。
mall.observe.cleanup.job.enabled=true

# ============================================================
# ⚠️ 与 a3 的边界（别混用）
# ============================================================
#
# · **CI 用 a3，不用 dev**：ci.yml 的 concurrency job 显式 SPRING_PROFILES_ACTIVE=a3，
#   且 A3 的 P5/P6/P7 探针依赖 /health/db —— 该端点 @Profile({"a3","dev"})，两个 profile 下都在。
# · **攻击模拟器用 dev**：它复用 A3 的**并发脚本框架**（scripts/concurrency/），但目的是
#   「演示效果」⇒ job 要开 ⇒ profile 用 dev。**「由 A3 改造」≠「用 a3 profile」。**

# ============================================================
# RabbitMQ（事件台账的出口；块 7 · commit 8c，2026-10-14 —— Migration ⑲ / 本笔 8c）
# ============================================================
#
# ⚠️ **dev 显式覆盖，a3 继承公共配置**（a3 那份的说明见 application-a3.properties 的对应小节）：
#    a3 是 CI 的 profile：host 从公共配置继承，但监听容器由 a3 末尾的 auto-startup=false 关掉。
#
# ⚠️ **口令一行有讲究**：`${MALL_MQ_PASSWORD:}` —— 环境变量注入 + **空默认值**。
#    ① **明文口令不进仓**（本仓既有铁律：明文口径一进 diff 就会被 push 拦下）。
#    ② 为什么默认值是**空**而不是写一个字面占位符如 `${MALL_MQ_PASSWORD}`：那样在没导出环境变量的
#       机器上会让 **@ConfigurationProperties 绑定阶段直接失败**（未解析的占位符 = 启动即崩）。
#       ⚠️ **这条实测过**（8c 验证）：空默认值能绑上、应用能起 —— 但空口令 = 认证失败，
#       而**认证失败会让消费者在启动期直接 fatal**（详见下一段），所以 `:` 后面那个空值
#       只解决「绑得上」，不解决「起得来」。起后端**必须**给这个环境变量。
#    ③ 起后端时这样给：`MALL_MQ_PASSWORD='<口令>' ./mvnw spring-boot:run …`（口令只在命令行环境里，
#       不落文件、不落日志；本类的连接失败日志由 Spring AMQP 自己打，**不含口令**）。
#
# ⚠️ **两种失败模式，行为完全不同 —— 这是 8c 验证时实测出来的（不是推的）**：
#    · broker **不可达**（端口无监听 / 网络不通）⇒ 只 WARN：消费者容器后台重试，应用照常启动。
#      实测：host 指一台没有 broker 的机器 ⇒ `Started MallManagementApplication in 24.052 seconds`，
#      日志里串起来的是 Spring AMQP 自己的 `AmqpIOException: SocketTimeoutException:
#      Connect timed out` 重连栈。⚠️ 探针那条 `[EVENT]` 在**那次一条都没有** —— 它原先只在
#      **翻转**时记，而 `connected` 初值就是 false、「一直不通」从不成翻转。这条洞已在 8c 内补掉：
#      首条立刻记、之后每 `mall.observe.mq.warn-interval-ms`（默认 5 分钟）一条
#      （见 `RabbitEventPublisher` 类注释末节）。
#    · broker **在但认不上**（口令错 / 用户错）⇒ **启动失败**：Spring AMQP 把认证失败当致命
#      （`FatalListenerStartupException: Authentication failure` → `Failed to start bean
#      'org.springframework.amqp.rabbit.config.internalRabbitListenerEndpointRegistry'`
#      → 整个上下文 refresh 失败）。
#      实测：把本文件的 password 置空起一次，后端**起不来**（日志原文见 `ObservedEventConsumer`
#      类注释）。这是刻意的设计（凭据错重试一万次也没用），不是本仓的 bug。
#    ⇒ 结论：**dev 下忘了导出 `MALL_MQ_PASSWORD` 会让后端起不来**，报错就是那句
#      ACCESS_REFUSED（够好认）。别指望它「降级」——降级是给「不可达」准备的。
#
# ⚠️ **消费者是有条件的**（`ObservedEventConsumer` 上的 `@ConditionalOnProperty`）：
#    2026-10-20 起 host 已进入公共配置 ⇒ 消费端 bean 在**所有** profile 都存在；a3/CI 靠
#    `application-a3.properties` 末尾的 auto-startup=false 关掉监听容器，避免 runner 上
#    localhost 无 broker 时启动即失败（上面那条「认证失败 ⇒ 启动失败」仍只适用于本 profile）。
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=mall
spring.rabbitmq.password=${MALL_MQ_PASSWORD:}
# 连接超时收到 2 秒：发布点在 **SSE 流线程**上（EventBroadcaster.poll() → EventPublisher.publish）
#   ⇒ 默认超时（数秒到数十秒）会让「broker 挂掉」变成「实时日志页卡住」。
#   ⚠️ 2 秒**不能**消掉那个窗口（RabbitEventPublisher 另有 5s 一次的连通性探针做闸门），
#   它只把「探针还没翻到 false 的那几次 publish」的代价压到每次 ≤2s。
spring.rabbitmq.connection-timeout=2s
# Publisher Confirms（correlated）：broker 未确认（nack）时记一条 WARN —— 本笔**不重发**
#   （契约是 fail-soft：事件丢了就丢了，「没有台账」不能反过来把业务请求拖红）。
spring.rabbitmq.publisher-confirm-type=correlated
# 消息退回（exchange 收下但没有队列绑定它时）。本笔的绑定是**代码里声明**的
#   （RabbitObserveConfig 的 @Bean），正常不会退回；开着是为了让「绑定被人删了」这件事
#   **有声音**而不是静默丢消息。
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
# 周期性 WARN 的间隔（`mall.observe.mq.warn-interval-ms`，默认 5 分钟）**刻意不写在本文件里**：
#   默认值在 `RabbitEventPublisher` 的 @Value 注解上就地可读，与 `mall.observe.cleanup.*`
#   那两个保留期同款处置（漏配一个 profile 时行为仍确定）。配 0 或负数 = 关掉节流、
#   恢复「每轮探测都记」—— 那是本笔修复**之前**的刷屏行为，别这么配。
