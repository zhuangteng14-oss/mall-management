# ============================================================
# smoke test 专用属性，由 @ActiveProfiles("smoke") 激活
# ============================================================
# 本文件只提供测试所需的最小属性集，不复制 src/main/resources/application.properties。
#
# 【为什么文件名带 -smoke 后缀，而不是直接叫 application.properties】
# 若在 src/test/resources/ 下放 application.properties，它会在 classpath 上屏蔽
# （shadow）src/main/resources/application.properties，因为 target/test-classes
# 排在 target/classes 之前。后果是现有测试 MallManagementApplicationTests
# （@SpringBootTest）会丢失 spring.datasource.* 配置而启动失败。
# 用 profile 后缀命名可避免该冲突：基础 application.properties 仍会被加载，
# 本文件的属性在其之上覆盖（profile 专属配置优先级更高）。
#
# 【app.upload-dir】
# 相对路径，相对于工作目录解析。按 agent.md 的测试命令
#   cd Mall-management-server && mvn test
# 工作目录即 Mall-management-server，故可正确定位到工程内的图片目录。
# 该属性由 ImgPath 读取，用于注册 /img/** 静态资源映射。
app.upload-dir=src/main/resources/static/img/
