# 【mall.observe.sse.max-ticks】C3 块 7 · commit 3（3 个 SSE 端点，2026-10-13）
# ⚠️ 与本文件其余各行**不是同一族**：那些钉的是「会自己醒来的东西」（job / 调度器），
#    本行钉的是「会自己**一直不结束**的东西」—— 流。
#
# 本块三个观测端点返回的是 `StreamingResponseBody`（无限推，1 秒 1 帧，见 `SseStreamWriter`）。
# 在 MockMvc 的 asyncDispatch 里，一条永不结束的流会让用例**挂住**（不是失败，是等下去）。
# ⇒ 本 profile 把它钉成 1：**推满一帧就正常结束**，于是「端点通、Content-Type 对、首帧格式对」
#   这三条可以在切片里断言（见 `ObserveStreamSmokeTest`）。
#
# ⚠️ 这是**测试专用**的口子，不是限流也不是降级：`SseStreamWriter` 的默认值是 0 = 无限，
#    生产语义（长连接一直推）不受本行影响 —— 本文件只由 @ActiveProfiles("smoke") 激活。
mall.observe.sse.max-ticks=1

