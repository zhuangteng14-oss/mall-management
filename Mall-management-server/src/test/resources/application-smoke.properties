# ============================================================
# smoke test 专用属性，由 @ActiveProfiles("smoke") 激活
# ============================================================
# 本文件只提供测试所需的最小属性集，不复制 src/main/resources/application.properties。
#
# 【为什么文件名带 -smoke 后缀，而不是直接叫 application.properties】
# 若在 src/test/resources/ 下放 application.properties，它会在 classpath 上屏蔽
# （shadow）src/main/resources/application.properties，因为 target/test-classes
# 排在 target/classes 之前。后果是现有测试 MallManagementApplicationTests
# （@SpringBootTest）会丢失 spring.datasource.* 配置而启动失败。
# 用 profile 后缀命名可避免该冲突：基础 application.properties 仍会被加载，
# 本文件的属性在其之上覆盖（profile 专属配置优先级更高）。
#
# 【app.upload-dir】
# 相对路径，相对于工作目录解析。按 agent.md 的测试命令
#   cd Mall-management-server && mvn test
# 工作目录即 Mall-management-server，故可正确定位到工程内的图片目录。
# 该属性由 ImgPath 读取，用于注册 /img/** 静态资源映射。
app.upload-dir=src/main/resources/static/img/

# 【app.auth.enabled】
# 鉴权闸在本 profile **显式关闭**（翻开关笔，2026-10-05）：主配置 application.properties
# 已由 false 翻成 true，而本目录下 10 个 smoke 类打的多数是**非白名单**端点
# （/order/orderAdd、/goods/goodsAdd、/goods/productCodePrice、/message/send …）
# ⇒ 靠继承会让它们**全变 401**。钉死在这里 ⇒ 10 个 smoke 类**零改动**保持全绿。
#
# ⚠️ 闸「开」的那一层**不受本行影响**：AuthGateSwitchOnTest / AuthSessionSwitchOnTest
#    用 @TestPropertySource 内联属性，而内联属性优先级**高于** profile 属性。
# ⚠️ 代价（有意，登记于 progress.md §5-AD）：钉住之后，OFF 那两层不再能发现
#    「主配置被误翻回 false」—— 该防线由上面两个 *SwitchOnTest 兜。
app.auth.enabled=false

# 【mall.downgrade.job.enabled】C3 块 2（用户块，2026-10-09）
# 与上一行同一族、同一位次：把「会自己醒来的东西」在本 profile 钉死。
# ⚠️ 坦白一句：本 profile 今日的 smoke 类**全是 @WebMvcTest**，而该切片
#    **不扫** @Component / 普通 @Configuration ⇒ MerchantDowngradeJob 与
#    MerchantDowngradeSchedulingConfig 在切片里根本不会被创建，**本行今日是空转**。
#    留着它的理由是「同一族风险的下一次」：一旦有人在本目录加一个 @SpringBootTest
#    （比如给封禁闸写一条真上下文的用例），本行就已经在那儿了，不必等那时才发现
#    「测试跑着跑着后台扫了一次库」。空转 ≠ 有害，但它**不是**在修的 bug。
mall.downgrade.job.enabled=false

# 【mall.order.shipping.track.enabled】C3 块 4 补丁（订单块，2026-10-10）
# 同上族、同位次。⚠️ 坦白一句，与上一行同款：本 profile 今日的切片**不扫** @Component
# ⇒ ShippingTrackAdvanceJob（@Component）在本目录里**根本不会被创建**，本行今日是**空转**。
# 且它调的 @Scheduled 依赖调度器，而调度器（@EnableScheduling）挂在 MerchantDowngradeSchedulingConfig
# —— 那也不是 web 组件，切片同样不扫。留着它仍是「同一族风险的下一次」：有人在本目录加
# @SpringBootTest 时，本行已经在那儿了。
mall.order.shipping.track.enabled=false

# 【mall.order.cancel.enabled】C3 块4 补丁 · 第 2 笔（订单块，2026-10-10 落码 / 2026-10-11 补本行）
# 同上族、同位次（「会自己醒来的东西」全钉死）。⚠️ 与本文件另两条同款坦白：
# 本 profile 今日的切片全是 @WebMvcTest，**不扫** @Component/@Configuration
# ⇒ OrderTimeoutCancelJob 与调度器都不会被创建，本行今日是**空转**。
# 留着它仍是「同一族风险的下一次」：有人在本目录加 @SpringBootTest 时，本行已经在那儿了。
mall.order.cancel.enabled=false
