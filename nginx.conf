# ============================================================================
# Mall Management · Nginx 生产代理模板
# ----------------------------------------------------------------------------
# 用法（Windows）：
#   0. 本机 nginx 安装在含中文的目录里，nginx.exe 的 ANSI 构建读不了中文路径
#      ⇒ 已复制一份 ASCII 副本到 C:/mall-deploy/nginx，本文件同步在
#        C:/mall-deploy/nginx/conf/nginx.conf（改完本文件请重新复制过去）。
#   1. 把本文件复制/覆盖到 <nginx 目录>/conf/nginx.conf；
#   2. 先 `nginx -t` 自检（在 C:/mall-deploy/nginx 下执行）；
#   3. `nginx` 启动（80 端口需要管理员权限），或 `start nginx`。
#
# 架构：浏览器 → :80 (Nginx)
#          ├─ /            → 前端静态产物 dist（Vue History 兜底 index.html）
#          └─ /user/ … /chat/ → 反代 http://127.0.0.1:8088（Spring Boot）
# ============================================================================

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    keepalive_timeout  65;
    client_max_body_size 20m;          # 商品图片等上传留余量

    server {
        listen       80;
        server_name  localhost;

        # 前端打包产物（绝对路径）
        # ⚠️ 本机 nginx.exe 是 ANSI 构建，路径含中文会报
        #    `No mapping for the Unicode character exists in the target multi-byte code page`
        #    ⇒ 真实产物在
        #      C:/Users/86159/Desktop/软件工程/期末项目/Mall-management-web/mall-management-system/dist
        #      这里指向它的 ASCII 镜像 C:/mall-deploy/dist（每次 build 后同步一次）：
        #      robocopy "<真实 dist>" "C:\mall-deploy\dist" /MIR
        root "C:/mall-deploy/dist";
        index index.html;

        # ── SSE 推流专用：实时日志 / 监控大盘 ───────────────────────────────────
        # proxy_buffering off + Connection 清空 + HTTP/1.1 是 SSE 不被攒批的充分条件；
        # 读超时放宽，避免长连接被 Nginx 主动掐断。
        location ~ ^/(chat|demo-stream)/ {
            proxy_pass http://127.0.0.1:8088;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            add_header X-Accel-Buffering no;
        }

        # 管理端实时推流（/admin/observe/metrics、/events、/orders）
        location ~ ^/admin/observe/ {
            proxy_pass http://127.0.0.1:8088;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            add_header X-Accel-Buffering no;
        }

        # 普通 API：用户 / 商品 / 订单 / 商家 / 管理 / 聊天
        # 说明：除题目点名的 6 个前缀外，还补齐了前端实际会调用的其余接口段
        #       （message、comment、cart、shop、img、observe、seckill 等），
        #       否则手测时会有一批请求落到 index.html 上变成 404/空响应。
        location ~ ^/(user|goods|order|merchant|admin|chat|message|comment|report|sensitive|notification|favorite|cart|shop|catalog|template|marketing|member|wallet|img|observe|health|stats|attack|seckill|subsidy|coupon|address|api)/ {
            proxy_pass http://127.0.0.1:8088;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 静态资源长缓存（文件名带 hash）
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # 管理端独立入口
        location = /admin {
            try_files /admin.html =404;
        }

        # Vue History 模式兜底：刷新任意前端路由都回到 index.html
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # 可选：开启 gzip
    # gzip on;
    # gzip_types text/css application/javascript application/json image/svg+xml;
}
