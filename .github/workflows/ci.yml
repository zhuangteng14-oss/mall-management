name: CI

# 触发：
#   1. 推送到 main
#   2. 面向 main 的 PR
#   3. 手动触发（Actions 页面的 Run workflow 按钮）
# 注意：GitHub 只对默认分支（main）显示手动触发按钮，
# 故 workflow_dispatch 需合入 main 后才可通过界面验证。
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

# 同一分支上的新推送取消上一次仍在跑的构建
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 后端：Maven 测试
  # 当前无需 MySQL：3 个 smoke test 走 @WebMvcTest 切片 + Mockito 替身
  # JdbcTemplate；MallManagementApplicationTests 由 A3_ENABLED 开关跳过（本 job 不设该
  # 变量，故跳过而非失败；TD-10 已关闭 —— 真跑它的是 concurrency job，那里有 MySQL）。
  # MySQL service 已引入，但落在下方 concurrency job；本 job 至今不需要 MySQL。
  # （此前这里写「计划在 A3 阶段引入」，A3 落地后即过期，2026-09-20 更正。）
  # ============================================================
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          # 缓存 ~/.m2/repository，缓存键基于 pom.xml 内容
          cache: maven

      # 跑全量测试（不加 -Dtest 过滤），使后续新增测试自动纳入 CI。
      # 依赖 mvnw 的可执行位（git 索引模式 100755）与 .gitattributes 的 eol=lf。
      - name: 运行后端测试
        working-directory: Mall-management-server
        run: ./mvnw -B test

      # if: always() 保证测试失败时报告仍会上传，便于定位
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: Mall-management-server/target/surefire-reports/
          if-no-files-found: warn

  # ============================================================
  # 前端：Vue CLI 生产构建
  # 与后端无依赖，并行执行。
  # 前端工程无测试框架、无 test 脚本，故此处只做依赖安装 + 构建。
  # Node 版本与本地开发环境一致（v20.17.0）。
  # ============================================================
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.17.0'
          cache: npm
          cache-dependency-path: Mall-management-web/mall-management-system/package-lock.json

      - name: 安装依赖
        working-directory: Mall-management-web/mall-management-system
        run: npm ci

      - name: 构建
        working-directory: Mall-management-web/mall-management-system
        run: npm run build

  # ============================================================
  # A3 并发测试（120 QPS）—— 阶段 E 的 CI 集成
  # 被测对象是「后端 + MySQL 8.4」这一对，故自带 MySQL，不借 backend 的。
  # 【首跑是观测跑】绿不等于通过，判定看报告里的 gates.failed 与 exitCode。
  # ============================================================
  concurrency:
    name: A3 concurrency (120 QPS)
    runs-on: ubuntu-latest
    # 单测红了就没有必要花几分钟跑压测
    needs: backend

    # 覆盖 workflow 级 concurrency（那一层是 cancel-in-progress: true）：那会把一次
    # 测量拦腰砍断 —— 被砍的运行没有报告（报告在结束时才落盘）、日志也是截断的，
    # 是最难排查的一种红。测量宁可排队，不该被下一次推送取消。
    concurrency:
      group: a3-${{ github.ref }}
      cancel-in-progress: false

    # 【首跑是观测跑，不是门禁】A-S1-1 / A-S2b-1 / A-S4b-1 断言的是传输层
    # （「5xx == 0 且连接错误 == 0」「success 比率 100%」）。CI 把压测器、后端、MySQL
    # 挤在同一台机器上（本地是「压测器 + 后端在本机、MySQL 在另一台 VM」），
    # 资源性假红的可能必须先实测一轮。反之若为迁就 CI 下调 --qps，TOCTOU / 锁争用
    # 类缺陷可能不复现 → 假绿，更坏。门禁地位待首跑数据后再定。
    continue-on-error: true

    services:
      mysql:
        # 必须 8.4：P1 是硬门禁，要求 VERSION() 以 "8.4." 开头（8.0 / latest 必红）。
        # 刻意不设 MYSQL_DATABASE：库由 SQL 文件第 15 行的 CREATE DATABASE 建
        # （TD-12 已登记该行为），与本机 VM 的导入路径一致。
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: '123456'
          # 本 job 用不到（导入走容器内 socket，不经 TCP）；保留是为将来 ——
          # P7 阴性对照默认以 root 走 TCP 连 127.0.0.1，当前被 --skip-negative-control
          # 关掉了，谁若打开它，root@'%' 得在。
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

      # 【块 7 · commit 8c 加的这一格：今天是**空转**的，加它是为了「同一族风险的下一次」】
      # 8c 给事件台账接了出口（业务事件 → RabbitMQ → 消费端批写 observed_event），拓扑与
      # 声明都在代码里（RabbitObserveConfig 的 @Bean），**本 job 不需要它**：a3 profile
      # **刻意不配** spring.rabbitmq.*（理由写在 application-a3.properties 末尾），客户端于是
      # 按 Boot 默认连 localhost:5672，而本 job 里后端进程在 runner 上、不在这个容器里。
      #
      # ⚠️ 把「空转」写明白，免得下一个人以为它在干活：
      #   · guest 用户**只许从容器内 loopback 登录**（RabbitMQ 的默认限制），连接来自 docker 网桥
      #     ⇒ 即便映射了端口，认证也会被拒；
      #   · 被拒的后果 = **发布侧**探针记 WARN（首条 + 每 5 分钟一条；**消费侧 bean 在 a3 里
      #     根本不存在**，见 application-a3.properties 末尾那段），**业务请求照走**（契约是
      #     fail-soft；这正是 A3 要的姿态：MQ 缺席时门禁数字必须不变，不能靠「本地有 broker」掩盖）。
      #     ⚠️ 反过来才是要防的：哪天 a3 也注册了监听器（比如有人把 host 那行挪进公共配置），
      #     本格这个「在、但拒 guest」的 broker 会把**启动**变成硬失败
      #     （`FatalListenerStartupException` → `Failed to start bean '…internalRabbitListenerEndpointRegistry'`
      #     → 上下文 refresh 失败；8c 验证时空口令那次实测到过同一栈）—— 那时红的是整个 job，不是几条 WARN。
      #   · 因此本格**不设** RABBITMQ_DEFAULT_USER / _PASS：将来 a3 真要连时，用户名与口令必须
      #     与**届时**在 application-a3.properties 里新加的那份配置对齐，而那件事会**同时**改三处
      #     （application-a3.properties / 本格 / 口令注入方式），漏改一处就会红 —— 留白是刻意的。
      #   · 就绪判据照 mysql 那格的形状给（rabbitmq-diagnostics -q ping），不另立一套。
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # B2 起 Redis：锁是**只能在真 Redis 上验**的东西，而本 job 的五个写路径全部走锁 ——
      # 没有它，A-S2a-1 会因为**环境**而红（不是缺陷）。
      #
      # ⚠️ 刻意用「步骤里 docker run」而不是 services：官方 redis 镜像的 entrypoint
      # **不接受**用环境变量传 redis-server 参数（已核实 7.4 的 docker-entrypoint.sh —— 它只处理
      # 「首个参数以 - 开头」这一种形式，而 services 只能给 options、给不了 command），
      # 本 job 又必须带 --requirepass：口令要与 application-a3.properties 的
      # ${A3_REDIS_PASSWORD:123456} 对齐（本 job 不设该变量 ⇒ 生效值就是 123456）。
      #
      # 就绪用**显式等 PONG**（等不到即 exit 1），语义同 service 的 health-check：
      # 后端若在 Redis 就绪前起来，第一次取锁失败就会把锁打进冷却窗口，
      # 那之后的 A-S2a-1 测的就不是锁、而是冷却。
      - name: 启动 Redis（B2：分布式锁的真后端）
        run: |
          docker run -d --name a3-redis -p 6379:6379 redis:7 redis-server --requirepass 123456
          for i in $(seq 1 30); do
            if docker exec a3-redis redis-cli --no-auth-warning -a 123456 ping 2>/dev/null | grep -q PONG; then
              echo "redis 已就绪（第 ${i} 次探测）"
              exit 0
            fi
            sleep 1
          done
          echo "redis 未在 30s 内就绪："
          docker logs a3-redis || true
          exit 1

      # 用容器自带的 mysql 客户端（8.4，与 server 同版本），不用 runner 预装的：
      # 预装版本不受控（当前 8.0，将来可能变），而导入应与 server 同版本。
      # 容器内 mysql 默认走本地 socket，故不需要 -h。
      #
      # S0-1 定稿的 VM 形态是 `echo 123456 | sudo -S -p '' mysql < ...`：那里必须 sudo
      # 是因为 root@localhost 是 auth_socket、root 无法 TCP 登录。容器里 root 可用
      # 口令连接，故不套 sudo —— 别把 sudo -S 形式抄到这里。
      - name: 导入库结构与种子数据
        run: |
          docker exec -i ${{ job.services.mysql.id }} mysql -uroot -p123456 -e "SELECT VERSION()"
          docker exec -i ${{ job.services.mysql.id }} mysql -uroot -p123456 < mall_management_sql.sql
          # test 账号的越权（GRANT ALL ON *.*）是 VM 上已登记的现状，这里刻意复刻，
          # 不在 CI「顺手修好」：改了它，CI 测的环境就与 A3 记录的环境不是同一个。
          docker exec -i ${{ job.services.mysql.id }} mysql -uroot -p123456 -e "CREATE USER IF NOT EXISTS 'test'@'%' IDENTIFIED BY 'test123'; GRANT ALL ON *.* TO 'test'@'%'; FLUSH PRIVILEGES;"

      # 先 package 再起 jar：一次构建同时满足两件事 —— ① pom 声明的是
      # mysql:mysql-connector-java:8.0.33，但该 artifact 是 **relocation pom**，
      # 实际 jar 落在 com.mysql:mysql-connector-j:8.0.33 —— 而 run.sh 的 D3 定稿路径
      # 写的就是这条新坐标，故直接命中（回退分支不会走到）。
      # ⚠️ 命中的理由是 relocation，**不是「名字相同」**：pom 里那个名字下本地只有
      # .pom 没有 jar。将来 pom 升版本时，run.sh 的 D3 路径必须同步改，否则会静默
      # 落到回退分支（2026-09-28 订正）。
      # ② 后台化的是 java 而不是 Maven 包装脚本，进程模型简单。
      - name: 构建后端
        working-directory: Mall-management-server
        run: ./mvnw -B -DskipTests package

      # 只由环境变量覆盖数据库/Redis 地址；绝不改 application-a3.properties 的默认值（仍指 VM）——
      # Redis 同样走环境变量覆盖（B2），理由与数据库一致：那份文件是「VM 上长什么样」的记录。
      # 口令**不覆盖**：a3 的 ${A3_REDIS_PASSWORD:123456} 默认值就与本 job 起的那只 Redis 一致。
      - name: 启动后端（a3 profile）
        working-directory: Mall-management-server
        env:
          SPRING_PROFILES_ACTIVE: a3
          A3_DB_URL: jdbc:mysql://127.0.0.1:3306/mall_management_sql?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf-8
          SPRING_DATA_REDIS_HOST: 127.0.0.1
        run: |
          nohup java -jar target/Mall-management-server-*.jar > "$GITHUB_WORKSPACE/app.log" 2>&1 &
          echo "$!" > /tmp/a3-app.pid

      # 预热：等就绪（最多 120s）后打 5 个请求，削掉 Tomcat / Hikari / JIT 的冷启动峰。
      # 本步刻意不判定、也尽量不失败 —— 就绪与否的权威判定是 run.sh 的 P5，它超时会
      # 给出明确原因；这里失败只会把「启动慢」变成一句没人看得懂的 curl 错误。
      # 边界：只预热通用路径（DispatcherServlet / JDBC / Hikari），order 系列的类不在
      # 其中，它替代不了 S1 自己的爬坡。
      - name: 预热后端
        run: |
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:8088/goods/goodstype && break
            sleep 2
          done
          for i in $(seq 1 5); do
            curl -s -o /dev/null -w "warmup $i → HTTP %{http_code} (%{time_total}s)\n" \
              http://127.0.0.1:8088/goods/goodstype || true
          done

      # TD-10 的关闭：@Disabled 换成 @EnabledIfEnvironmentVariable(named="A3_ENABLED")，
      # 于是「有 MySQL 就真跑」不再需要改代码，只由本步的 env 打开；backend job 不设该
      # 变量，那里的全量 mvn test 会自动跳过本测试。
      #
      # 连接目标走默认 profile（application.properties：localhost:3306/mall_management_sql，
      # root/123456）—— 与本 job 的 MySQL service 及库名吻合（库由 SQL 文件自建）。
      # 刻意不在此加 SPRING_PROFILES_ACTIVE=a3：a3 profile 的默认值指向 VM 的
      # 192.168.229.129，那是给「上一个 step 启动的被测后端」用的，不是给本测试用的。
      #
      # ⚠️ 但默认 profile 下 application.properties **不含**任何 spring.data.redis.*（B2 新增，
      # 2026-09-29）⇒ 必须由下面两个环境变量补上，否则会走 Boot 默认（localhost:6379、无口令），
      # 在有口令的 Redis 上是 NOAUTH。而 NOAUTH 的表现是**四路全 degraded 而不是报错** ——
      # LockSceneRedisTest 的每个场景都显式断言 degraded == 0，就是要把这两种情况分开报。
      #
      # @SpringBootTest 默认 webEnvironment=MOCK，不真起 Tomcat、不占 8088，
      # 故与上一个 step 起的 jar 不冲突；本 step 只读（一条 SELECT 1），不写业务数据。
      #
      # 两个方法的职责不同，别混为一谈：contextLoads 只证明「全上下文能启动」——
      # 实测（三探针，2026-09-20）库名不存在乃至端口无监听时它都 PASS；真正把
      # 「连得上」变成断言的是 databaseIsReachable（SELECT 1），本 step 现在才会
      # 因库不可达而变红。
      #
      # LockSceneRedisTest（B2）同一步跑：四个锁场景（等待/冲突/超时/死锁）需要真 Redis，
      # 而它是「锁在真争用下也对」的唯一证据 —— mock 不会互相排他。它另有一条判据
      # 直接驳回「环境不通」：degraded != 0 时失败信息会指向连接而不是锁。
      - name: 全上下文启动冒烟 + 数据库可达性 + 锁场景（由 A3_ENABLED 打开）
        working-directory: Mall-management-server
        env:
          A3_ENABLED: "true"
          SPRING_DATA_REDIS_HOST: 127.0.0.1
          SPRING_DATA_REDIS_PASSWORD: "123456"
        run: ./mvnw -B -Dtest=MallManagementApplicationTests,LockSceneRedisTest test

      # --skip-negative-control 是必需的，不是图省事：P7 第一段就是「阴性对照库与目标库
      # 是同一主机 → FAIL 对照无意义」并按 exit 2 短路，而 CI 里目标库本就是 127.0.0.1 上的
      # service container，必然命中 —— 那条「本机不可达自动 skip」的路在 CI 不成立。
      # 对照要证明的是「目标不是开发机上那个同名库」，CI 里不存在第二个库，无对象可对照。
      # OD-4 在 CI 仍由 P2（主机串比对）+ P6（哨兵往返，证明后端与脚本同库）兜住。
      #
      # --ready-timeout-sec 180 = 默认 60 的三倍余量：P5 超时是 FAIL 不是 skip，
      # 值给小了会把「GHA 冷启动慢」变成假红。这是 CI 与本地命令的一处**刻意不同**，
      # 将来比对 QPS 时要知道。
      - name: 运行 A3 并发测试
        run: |
          scripts/concurrency/run.sh \
            --base-url http://127.0.0.1:8088 \
            --jdbc-url "jdbc:mysql://127.0.0.1:3306/mall_management_sql?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf-8" \
            --jdbc-user test --jdbc-password test123 \
            --expect-db-host 127.0.0.1 \
            --skip-negative-control \
            --ready-timeout-sec 180 \
            --run-id "ci${{ github.run_number }}"

      # B2 取证：A3 运行器**不读** metrics（它只看接口响应与数据库），故不补这一步，
      # 锁指标在 A3 上就是零证据 —— 而「锁到底有没有在真流量下工作」正是本笔要证的东西。
      # 放在停止后端**之前**：进程一退，这些数就没了；if: always() 让门禁红的那次也留证。
      # ⚠️ 只读、不判定：判定在 run.sh 的门禁里（A-S2a-1 等），这里失败不该把原因盖掉。
      - name: 采集锁指标（B2 取证，不判定）
        if: always()
        run: |
          for m in mall.lock.acquires mall.lock.holds mall.lock.up; do
            echo "=== /actuator/metrics/$m ==="
            curl -s "http://127.0.0.1:8088/actuator/metrics/$m" || true
            echo
          done
          echo "=== 锁键残留（正常运行应为空：取锁→释放会删键）==="
          docker exec a3-redis redis-cli --no-auth-warning -a 123456 --scan --pattern 'mall:lock:*' || true

      # 先让后端退场再上传，app.log 的尾部不至于留在缓冲里。
      - name: 停止后端
        if: always()
        run: kill "$(cat /tmp/a3-app.pid)" 2>/dev/null || true

      # if: always() 不只是为了「失败也要留证据」：门禁红的那次运行恰恰是最需要看报告的。
      # if-no-files-found: warn 与 backend job 一致 —— 若 run.sh 根本没跑起来，
      # 这里再报一个 artifact 错误只会把真正的失败原因盖掉。
      - name: 上传 A3 报告与日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a3-concurrency-report
          path: |
            scripts/concurrency/reports/
            app.log
          if-no-files-found: warn
