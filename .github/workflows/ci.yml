name: CI

# 触发：推送到 main，以及面向 main 的 PR
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 同一分支上的新推送取消上一次仍在跑的构建
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 后端：Maven 测试
  # 当前无需 MySQL：3 个 smoke test 走 @WebMvcTest 切片 + Mockito 替身
  # JdbcTemplate；MallManagementApplicationTests 由 @Disabled 跳过（TD-10）。
  # MySQL service 计划在 A3 阶段引入。
  # ============================================================
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          # 缓存 ~/.m2/repository，缓存键基于 pom.xml 内容
          cache: maven

      # 跑全量测试（不加 -Dtest 过滤），使后续新增测试自动纳入 CI。
      # 依赖 mvnw 的可执行位（git 索引模式 100755）与 .gitattributes 的 eol=lf。
      - name: 运行后端测试
        working-directory: Mall-management-server
        run: ./mvnw -B test

      # if: always() 保证测试失败时报告仍会上传，便于定位
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: Mall-management-server/target/surefire-reports/
          if-no-files-found: warn

  # ============================================================
  # 前端：Vue CLI 生产构建
  # 与后端无依赖，并行执行。
  # 前端工程无测试框架、无 test 脚本，故此处只做依赖安装 + 构建。
  # Node 版本与本地开发环境一致（v20.17.0）。
  # ============================================================
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.17.0'
          cache: npm
          cache-dependency-path: Mall-management-web/mall-management-system/package-lock.json

      - name: 安装依赖
        working-directory: Mall-management-web/mall-management-system
        run: npm ci

      - name: 构建
        working-directory: Mall-management-web/mall-management-system
        run: npm run build
