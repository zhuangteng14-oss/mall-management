    Q6 这份稿我为什么这样改？和 v4 的根本差异是什么？
       · 根本差异只有一条：**右信息栏从「白底 + 一堆发丝线」变成了一块釉面**。
         v4 那一栏改前**连一条 CSS 规则都没有** —— 落码时它是一块纯白，分区完全靠 `.promo`
         的框线、`.promise` 的四格线、`.shop` 的框线这三组线撑着。v5 把这三组线一起退役，
         因为它们铺在釉面上等于不存在。
       · 为什么用「面」而不是「再加点绿」：`--brand` 彩度只有 0.072，靠它做**面积**等于把一个
         「釉」级别的色硬撑成大色块，会直接偏成「促销绿」。釉面（ΔE00 8.01）承担面积、
         `--brand-ink` 承担重点，这正是《配色分析》第 125/127 行两条处方的分工。
       · 与跨页语言的关系：全批第 **6** 处 `--glaze-deep` 面（前 5 处：LoginPage 品牌栏 /
         OrderCenter 数据概览 / ShoppingCart 结算栏 / 两个 UserCenter 身份卡）。
       ⚠️ **这片底有一处代价，实测数字摆在这里，不藏**：栏内 8 处 12px 的 `--ink-3` 小字
         （促销 / 领券 / 满 199 可用 / 型号 / 数量 / 现货提示 / 加入购物车 / 店铺副标题）
         对比度从白底的 **5.57:1** 落到釉面上的 **4.26:1**，低于正文 WCAG AA 的 4.5:1。
         ⚠️ 这是**批级既有特征，不是本页新引入**：OrderCenter 的 `.stat .k`、
         ShoppingCart 的 `.paybar .sel .cnt` / `.sums .d` 早已在 `--glaze-deep` 上用 `--ink-3`，
         同一组数字。本笔**不在这页单方面改字色**（改了会让本页与其余 5 页不一致），
         而是把它作为**批级待决项**上报：要么 6 页一起把面上的 `--ink-3` 提到 `--ink-2`
         （6.14:1），要么接受 4.26:1。
         ⚠️ `check-contrast.mjs` **不会**报它 —— 那支探针的判据是 **3:1**，只抓「根本看不见」
         那种事故（它自己第 11-12 行的原话是「比正文 4.5:1 松」）。探针报 OK 只说明它查的那条
         没问题，不说明这条没问题。
  ═══════════════════════════════════════════════════════════════════════════════

/* ⚠️ v5：这一栏加**釉面底** —— 本页的「一个釉面主块」，落判据 B 的「主区有色、次区白」。

   两条判据同时指向这里：
     ① 判据 A（《配色分析》第 125 行处方一）：「**把「色」放到面上**，而不是放到标记上。
        大面积用釉色系承担『这页有色』的观感」；
     ② 判据 B：「商品详情**主区有色**次区白」—— 这栏装的是价格与两个动作按钮，就是主区。
   `--glaze-deep` **不是新发明**：全批已有 **5 处**同款面（LoginPage 品牌栏 / OrderCenter 数据概览 /
   ShoppingCart 结算栏 / 两个 UserCenter 身份卡），本页补第 6 处，是这条跨页语言的收口。
   `margin-left` 取 `--s5` 负值把面往左扩 24px、`padding-left` 再补回来 ⇒ **栏内文字 x 坐标不变**，
   只有底色向外长出去。`padding-top:--s6` 让商品名与面顶留出呼吸位。

      8 处 12px 的 `--ink-3` 小字对比度从 5.57:1 落到 **4.26:1**（低于正文 AA 4.5:1）——
      后者是**批级既有特征**（OrderCenter `.stat .k` / ShoppingCart `.paybar .sel .cnt` 早已如此），

/* ⚠️ v5 收尾：底从 `--glaze-deep` 换成**新增的 `--glaze-mid`**（#dbe3de → #e4e9e7）。

.pick{margin-top:var(--s6)}
.pick .lbl{font-size:var(--fs-xs);color:var(--ink-3)}
.pick .row{margin-top:var(--s3);display:flex;gap:var(--s3);flex-wrap:wrap}
.md{height:36px;padding:0 var(--s5);border:1px solid var(--line-2);border-radius:var(--r1);
    color:var(--ink-2);font-size:var(--fs-sm)}
.md:hover{border-color:var(--ink-3)}
.md.on{border-color:var(--brand);color:var(--brand-ink);font-weight:var(--fw-med)}

/* 数量：与购入弹窗同款步进器（同一模块同一形态） */
.qty{margin-top:var(--s6);display:flex;align-items:center;gap:var(--s4)}
.qty .lbl{font-size:var(--fs-xs);color:var(--ink-3)}
.stepper{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:var(--r1)}
.stepper button{width:36px;height:36px;color:var(--ink-2);line-height:1}
.stepper button:hover{color:var(--brand-ink)}
.stepper input{width:56px;height:36px;border:0;border-left:1px solid var(--line);
               border-right:1px solid var(--line);text-align:center;background:var(--surface-2);
               font-variant-numeric:tabular-nums}
.stepper input:focus{outline:none;background:var(--surface)}
.qty .stock{font-size:var(--fs-xs);color:var(--ink-3)}

/* 动作：三级权重 —— 实心（立即购买）/ 描边（加入购物车，占位）*/
.acts{margin-top:var(--s6);display:flex;gap:var(--s3)}
.acts .b{height:52px;border-radius:var(--r2);font-size:var(--fs-md);font-weight:var(--fw-med)}
.acts .primary{flex:1 1 auto;background:var(--brand);color:var(--bg)}
.acts .primary:hover{background:var(--brand-hover)}
.acts .ghost{flex:0 0 176px;border:1px solid var(--line-2);color:var(--ink-3)}
.acts .ghost[disabled]{cursor:not-allowed}

/* 服务承诺条：横排四格，等宽等重，靠**间距**分组（跨页共性组件 —— 登记在 GoodsAdd 页头注，
   「文案必须与 ProductPage 承诺条**逐字一致**」；注意那条登记约束的是**文案**，不是样式，
   购物车那边的同源件 `.pledge` 本来就是 brand 小圆点 + 上下发丝线，两页样式本就不同）。
   ⚠️ v5：原来这四格是「上下各一根发丝线 + 相邻格之间一根竖线」，**四根线全删**。
   右栏升成釉面之后它们**实测不可见** —— 不是"变淡"，是没了（原因与 `.promo` 那条逐字相同：
   `--line` 对 `--glaze-deep` 只差蓝通道 7/255）。
   ⇒ 改法：去线，四格交给 grid 等分间距（判据 C「**同级用间距**」）；另给每格一个 brand 小圆点作行标记，
     用的就是 ShoppingCart `.pledge span::before{content:"·";color:var(--brand);margin-right:var(--s2);
     font-weight:var(--fw-semi)}` —— **逐字同款**，跨页同源件终于长得一样了。
   ⇒ 顺带这也是《配色分析》第 127 行处方二要的「青瓷绿**提高频次、不提高面积**」：
     四个 `·` 加起来不到 0.01% 面积，但把"这页有青瓷绿"又往右推了一格。 */
.promise{margin-top:var(--s6);display:grid;grid-template-columns:repeat(4,1fr)}
.promise span{padding:var(--s3) 0;text-align:center;font-size:var(--fs-xs);color:var(--ink-2)}
.promise span::before{content:"·";color:var(--brand);margin-right:var(--s2);font-weight:var(--fw-semi)}

/* 商家卡。
   ⚠️ v5：删掉 `border:1px solid var(--line)`（理由与 `.promo` / `.promise` 逐字相同：
   `--line` 铺到 `--glaze-deep` 上整根消失）。分组由 `margin-top:--s6` 与左上角那块
   `--brand-soft` 方章承担 —— 1440 试版里这两样本来就够，边框只是看不见的残留。
   ⚠️ 同一处注释订正：上一版写「跨页共性组件：商品详情 / 订单中心 同款」——**这句不成立**。
   全批 grep 结果：`.shop{` 只在本页是「商家卡」这一套规则；OrderCenter-merchant.html:522 与
   ShoppingCart-customer.html:326 里的 `.shop` 是 `{border-top:1px solid var(--line-2)}`，
   是**店铺分组表头**，只是**类名撞车**（v5 收尾实测；原记 :484 / :324），故本页不涉跨页同步。 */
.shop{margin-top:var(--s6);display:flex;align-items:center;gap:var(--s4);
      padding:var(--s4)}
.shop .mark{width:44px;height:44px;flex:0 0 auto;border-radius:var(--r2);background:var(--brand-soft);
            color:var(--brand-ink);font-family:var(--font-display);font-size:var(--fs-lg);
            display:flex;align-items:center;justify-content:center}
/* ⚠️ 店名与副标题都是 span：**不 display:block 会挤在同一行**（1440 首版「声谷小店 数码配件 ·
   商品类型：影音耳机」连成一句，截图抓到）。同理两个操作按钮要 nowrap，否则「客服」折成「客/服」 */
.shop .nm{display:block;font-size:var(--fs-sm);font-weight:var(--fw-med)}
.shop .sub{display:block;margin-top:2px;font-size:var(--fs-xs);color:var(--ink-3)}
.shop .ops{margin-left:auto;display:flex;gap:var(--s2);flex:0 0 auto}
.shop .ops button{height:32px;padding:0 var(--s3);border:1px solid var(--line-2);border-radius:var(--r1);
                  font-size:var(--fs-xs);color:var(--ink-2);white-space:nowrap}
.shop .ops button:hover{border-color:var(--ink-3);color:var(--ink)}

/* ── Tab 条 + 面板 ───────────────────────────────────────────────────────── */
.tabs{margin-top:var(--s8);display:flex;gap:var(--s6);border-bottom:1px solid var(--line-2)}
.tabs button{padding:var(--s4) 0;font-size:var(--fs-sm);color:var(--ink-3);
             border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--ink-2)}
.tabs button.on{color:var(--brand-ink);font-weight:var(--fw-med);border-bottom-color:var(--brand)}
.tabs .cnt{font-size:var(--fs-xs);color:var(--ink-3);margin-left:var(--s1)}
.panel{margin-top:var(--s6)}
.para{max-width:68ch;font-size:var(--fs-sm);line-height:1.9;color:var(--ink-2)}
.para+.para{margin-top:var(--s4)}
.longimg{margin-top:var(--s5);aspect-ratio:3/1;border:1px solid var(--line);border-radius:var(--r2);
         background:var(--img);display:flex;align-items:center;justify-content:center;
         color:var(--ink-3);font-size:var(--fs-xs);letter-spacing:.08em}

/* 规格参数表 */
.spec{max-width:640px;font-size:var(--fs-sm)}
.spec .r{display:flex;padding:var(--s3) 0;border-bottom:1px solid var(--line)}
.spec .k{width:110px;flex:0 0 auto;font-size:var(--fs-xs);color:var(--ink-3);padding-top:2px}
.spec .v{color:var(--ink-2)}

/* 评价区：分数 + 好评率条 + 评价卡列表 + 图评 + 分页 */
.rev{display:grid;grid-template-columns:200px minmax(0,1fr);gap:var(--s8);align-items:start}
.score .n{font-family:var(--font-display);font-size:var(--fs-xl);font-weight:var(--fw-med);line-height:1;
          font-variant-numeric:tabular-nums}
.score .of{margin-top:var(--s2);font-size:var(--fs-xs);color:var(--ink-3)}
/* 星级：实心 --ink、空心 --ink-3（不用 --line-2：那是 1.5:1，探针会判「看不见」）。
   ⚠️ 不用 --accent —— tokens.css:107-117 明令朱砂「只给价格和促销」 */
.stars{color:var(--ink);letter-spacing:2px}
.stars .e{color:var(--ink-3)}
.bars{margin-top:var(--s5);display:flex;flex-direction:column;gap:var(--s2)}
.bars .b{display:flex;align-items:center;gap:var(--s3);font-size:var(--fs-xs);color:var(--ink-3)}
.bars .b i{font-style:normal;width:34px;flex:0 0 auto;font-variant-numeric:tabular-nums}
.bars .track{flex:1 1 auto;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.bars .fill{display:block;height:100%;background:var(--ink-2)}
.shots{margin-top:var(--s5);display:flex;gap:var(--s2)}
.shots .s{width:64px;aspect-ratio:1/1;border:1px solid var(--line);border-radius:var(--r1);background:var(--img)}
.rlist{margin-top:var(--s1)}
.rc{padding:var(--s5) 0;border-bottom:1px solid var(--line)}
.rc .h{display:flex;align-items:center;gap:var(--s3);font-size:var(--fs-sm)}
.rc .who{font-weight:var(--fw-med)}
.rc .when{margin-left:auto;font-size:var(--fs-xs);color:var(--ink-3);font-variant-numeric:tabular-nums}
.rc .txt{margin-top:var(--s3);font-size:var(--fs-sm);line-height:1.8;color:var(--ink-2);max-width:64ch}
.rc .sku{margin-top:var(--s2);font-size:var(--fs-xs);color:var(--ink-3)}
.pager{margin-top:var(--s5);display:flex;align-items:center;gap:var(--s2)}
.pager button{min-width:32px;height:32px;padding:0 var(--s2);border:1px solid var(--line-2);
              border-radius:var(--r1);font-size:var(--fs-xs);color:var(--ink-2)}
.pager button.on{border-color:var(--brand);color:var(--brand-ink);font-weight:var(--fw-med)}
.pager .gap{color:var(--ink-3);font-size:var(--fs-xs);padding:0 var(--s1)}

/* 售后保障：三行政策，纯静态 */
.pol{max-width:72ch}
.pol .r{display:flex;gap:var(--s5);padding:var(--s5) 0;border-bottom:1px solid var(--line)}
.pol .k{width:112px;flex:0 0 auto;font-size:var(--fs-sm);font-weight:var(--fw-med)}
.pol .v{font-size:var(--fs-sm);line-height:1.9;color:var(--ink-2)}

/* ── 推荐区（猜你喜欢）—— 卡与搜索页 / 购物车 / 个人中心同款 ──────────────── */
.reco{margin-top:var(--s8);padding-top:var(--s7);border-top:1px solid var(--line-2)}
.reco h2{font-family:var(--font-display);font-size:var(--fs-lg);font-weight:var(--fw-med);letter-spacing:-.01em}
.reco .src{margin-top:var(--s2);font-size:var(--fs-xs);color:var(--ink-3)}
.cards{margin-top:var(--s5);display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s5)}
.card{display:block}
.card .ph{aspect-ratio:1/1;border:1px solid var(--line);border-radius:var(--r2);background:var(--img)}
/* 名占 **min-height** 两行（line-height 1.5 ⇒ 2 行 = 3em）并夹到两行：
   ⇒ 同排卡片的价永远在同一水平线上（跨页共性组件的统一规则）。
   ⚠️ 写成 `max-height` 时名短的那张卡不会撑开，价就跟着上移、同一排对不齐 */
.card .nm{margin-top:var(--s3);font-size:var(--fs-sm);line-height:1.5;min-height:3em;
          display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* ⚠️ v5 收尾：与主价格行**同一处缺陷** —— `¥` / `.00` 走 `--font`、只有整数 `<b>` 走
   `--font-display`，同一串价格两族混排。这里一并把整串归族。
   ⚠️ 上一版我把这条写成「跨页同款件，搜索页 / 购物车 / 个人中心共用」——**这句没有依据**：
   `grep -l '\.card \.pr' *.html` 全批**只有本页有**这个类名。跨页真正同源的是
   `.c-price`（购物车 / 搜索）与 `.money`（GoodsAdd），它们的 `¥` 归族情况**本笔未核**，
   已列入《v5-配色分析》收尾待决清单，等一次批级订正。 */
.card .pr{margin-top:var(--s2);display:flex;align-items:baseline;color:var(--accent);
          font-family:var(--font-display);font-variant-numeric:tabular-nums}
.card .pr i{font-style:normal;font-size:var(--fs-xs);margin-right:1px}
.card .pr b{font-family:var(--font-display);font-size:var(--fs-md);font-weight:var(--fw-med);line-height:1}
.card .pr em{font-style:normal;font-size:var(--fs-xs)}

/* ── 弹窗（购入 / 付款确认）───────────────────────────────────────────────── */
/* ⚠️ 居中用子元素 margin:auto，**不用** align-items:center —— 后者在内容比视口高时
   会把两端一起裁掉且滚不到（GoodsUp 弹窗踩过）；容器给 overflow:auto */
.scrim{position:fixed;inset:0;z-index:200;display:flex;padding:var(--s5);overflow:auto;
       /* 不用 rgba()：README 第 2 条「颜色只有 token，一个 #hex / rgb() 都不许有」 */
       background:color-mix(in srgb, var(--ink) 34%, transparent)}
.dlg{margin:auto;width:100%;max-width:520px;background:var(--surface);border:1px solid var(--line-2);
     border-radius:var(--r3);padding:var(--s7)}
.dlg-h{font-family:var(--font-display);font-size:var(--fs-lg);font-weight:var(--fw-med);letter-spacing:-.01em}
.dlg-sub{margin-top:var(--s2);font-size:var(--fs-xs);color:var(--ink-3)}
/* ── 购入弹窗的商品行（v5 收尾改 3）─────────────────────────────────────────────
   整块从 ShoppingCart-customer.html 搬来。列头与商品行**共用一份列宽** ⇒ 天然对齐
   （那边 `.list-head,.row` 就是这个写法，原样照搬）。层级照购物车：
     缩略图 64 方图（最小）/ 名（最重）/ 单价（**最轻**的数字）/ 数量 / 小计（列表里最重的数字）。
   ⚠️ 三处**有意不同**，逐条说清：
     ① 少两列「勾选」与「操作」——购入弹窗只买一件，没有选项也没有删除；
     ② 购物车 `.qty` 是 `button/span/button`，这里仍是 `.stepper`（`button/input/button`）——
        真实实现是 `number` 输入（`title` 记着 min=0 / max=100）。**形态同款，只按行高收窄**
        （36→28px），因为这一行的行高只有 64px 那一级；
     ③ 列宽按 760px 弹窗重算（购物车那边是 1180px 页宽）。
   ⚠️ 选择器**一律挂在 `.dlg` 下**：`.sub` 本页商家卡已经用了（`.shop .sub`），
      `.li` 也太泛，不挂容器就会串。
   ⚠️ **随标记一起删掉的六条**：`.drow` / `.drow.first` / `.drow .k` / `.picked` /
      `.picked .li` / `.picked .li .x`（+ 一条 `:hover`）。不留死规则 ——
      本页 v5 已经清过一次「指向不存在规则的死规则」，代价写在窄屏段注释里。 */
.dlg .li-head,.dlg .li{display:grid;grid-template-columns:64px minmax(0,1fr) 80px 112px 104px;
                       align-items:center;gap:var(--s4)}
.dlg .li-head{margin-top:var(--s6);padding-bottom:var(--s3);font-size:var(--fs-xs);color:var(--ink-3)}
/* ⚠️ 列头只有 4 个标签、商品行有 5 列 ⇒ 「商品」必须**跨前两列**（缩略图 + 名称），
   否则后三个标签整体左移一列。第一版没写这条，1440 截图上「单价」标签落在名称列中间、
   与小计数字对不上（Q3 自查抓到的）。 */
.dlg .li-head > span:first-child{grid-column:1/3}
.dlg .li-head .c-num{text-align:right}
.dlg .li{padding:var(--s4) 0;border-bottom:1px solid var(--line-2)}
.dlg .li .thumb{width:64px;aspect-ratio:1/1;border-radius:var(--r1);background:var(--img);
                border:1px solid var(--line)}
.dlg .li .nm{min-width:0}
.dlg .li .nm .t{font-size:var(--fs-md);font-weight:var(--fw-med);line-height:1.35;color:var(--ink);
                display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dlg .li .opt{margin-top:var(--s2);display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.dlg .li .opt .lbl{font-size:var(--fs-xs);color:var(--ink-3)}
.dlg .li .opt .md{height:28px;padding:0 var(--s3);font-size:var(--fs-xs)}
.dlg .li .unit{text-align:right;font-size:var(--fs-sm);color:var(--ink-3);
               font-variant-numeric:tabular-nums}
.dlg .li .stepper{justify-self:end}
.dlg .li .stepper button{width:28px;height:28px;font-size:var(--fs-sm)}
.dlg .li .stepper input{width:40px;height:28px;font-size:var(--fs-sm)}
.dlg .li .sub{text-align:right;font-family:var(--font-display);font-size:var(--fs-lg);
              font-weight:var(--fw-med);font-variant-numeric:tabular-nums}
.dfoot{margin-top:var(--s5);display:flex;align-items:baseline;gap:var(--s5)}
.dfoot .meta{font-size:var(--fs-xs);color:var(--ink-3)}
.dtotal{margin-left:auto;display:flex;align-items:baseline;gap:var(--s2)}
.dtotal .k{font-size:var(--fs-sm);color:var(--ink-2)}
.dtotal .v{font-family:var(--font-display);font-size:var(--fs-xl);font-weight:var(--fw-med);
           line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.dtotal .v i{font-style:normal;font-size:var(--fs-sm);margin-right:2px}
.dacts{margin-top:var(--s6);display:flex;gap:var(--s3)}
.dacts .b{height:46px;border-radius:var(--r2);font-size:var(--fs-md);font-weight:var(--fw-med)}
.dacts .ok{flex:1 1 auto;background:var(--brand);color:var(--bg)}
.dacts .ok:hover{background:var(--brand-hover)}
.dacts .no{flex:0 0 120px;border:1px solid var(--line-2);color:var(--ink-2)}
.dacts .no:hover{border-color:var(--ink-3)}

/* ── 窄屏 ───────────────────────────────────────────────────────────────────
   ① 1080：**仍然是两栏**，只把画廊收窄（56/44 → 44/56）。
      ⚠️ 这一版最先写成「1080 直接折单列 + 画廊封顶 520px」，截出来是「520px 灰板 + 右边
      512px 空白」——折行折得太早，页面上出现一块说不清的空地（Q3 自查抓到的）。
   ② 820 以下才真正堆叠；那时**必须给图集封顶**，否则 `aspect-ratio:1/1` 落在整幅宽
      （820 下 780px）会变成一块 780×780 的灰板，把信息全挤出首屏。 */
@media (max-width:1080px){
  .pd{grid-template-columns:minmax(0,44fr) minmax(0,56fr);gap:var(--s7)}
  .thb{width:60px}
  .acts .ghost{flex:1 1 0}
  .rev{grid-template-columns:160px minmax(0,1fr);gap:var(--s7)}
  .cards{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:820px){
  .pd{grid-template-columns:1fr;gap:var(--s7)}
  .gal{max-width:520px}
  .rev{grid-template-columns:1fr;gap:var(--s7)}
  .promise{grid-template-columns:repeat(2,1fr)}
  /* ⚠️ v5：这里原来有一条 `.promise span:nth-child(odd){border-left:0}`，
     注释是「四格折两行后第 3 格会继承 `span+span` 的左边线」—— 那条 `span+span` 规则
     已在 v5 连同另外四根发丝线一起删除（见上），所以这条成了**指向不存在规则的死规则**，
     一并删掉。留着的代价：下一次改窄屏的人会以为竖线还在。 */
  /* ⚠️ v5 新增：单列断点下右信息栏不再左扩。上面 `.info` 的 `margin-left:calc(var(--s5) * -1)`
     是**双列时**为了把釉面往左长进栅格间隙（`--s8`=64px 里留 40px）而写的；折成单列后
     它会把面板推到 **wrap 的 padding 边**（820 视口下即 x=0），而右缘仍在内容盒上
     ⇒ 左右各差 24px 的**不对称**。这里归零，面板与 wrap 内容盒对齐。 */
  .info{margin-left:0}
}
</style>
</head>
<body>

<div class="bar">
  <span class="bar-t">B 稿 v5 · 商品详情 <em>公开页 · 不进壳</em></span>
  <button data-page="detail" class="on">登录态</button>

    + TABS.replace(`data-tab="${active}"`, `data-tab="${active}" class="on"`)
    + PANELS[active] + RECO
}
/* Tab 局部视图：也要能看出这是哪一页 ⇒ 保留面包屑 + 一行商品名，不重复图集与购买区 */
function renderLocal(active) {
  return CRUMB
    + `<h1 class="pname" style="margin-top:var(--s4)">无线蓝牙耳机 声谷标准版 主动降噪 32 小时续航</h1>`
    + TABS.replace(`data-tab="${active}"`, `data-tab="${active}" class="on"`)
    + PANELS[active] + RECO
}

document.getElementById('pd-detail').innerHTML = renderFull('desc')
document.getElementById('pd-guest').innerHTML  = renderFull('desc')
document.getElementById('pd-t-spec').innerHTML = renderLocal('spec')
document.getElementById('pd-t-rev').innerHTML  = renderLocal('rev')
document.getElementById('pd-t-as').innerHTML   = renderLocal('as')

/* ── 切页 + 弹窗开关（弹窗真的能开能关，不只是静态图）─────────────────────── */
const bar = document.querySelector('.bar')
function go(key) {
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('on', p.dataset.page === key))
  bar.querySelectorAll('button[data-page]').forEach(b => b.classList.toggle('on', b.dataset.page === key))
  window.scrollTo(0, 0)
}
bar.querySelectorAll('button[data-page]').forEach(b => b.addEventListener('click', () => go(b.dataset.page)))

document.addEventListener('click', e => {
  const to = e.target.closest('[data-to]')
  if (to) { go(to.dataset.to); return }
  const close = e.target.closest('[data-close]')
  if (close) { go('detail'); return }
  const md = e.target.closest('.md')
  if (md) document.querySelectorAll('.md').forEach(x => x.classList.toggle('on', x === md))
  const thb = e.target.closest('.thb')
  if (thb) thb.parentNode.querySelectorAll('.thb').forEach(x => x.classList.toggle('on', x === thb))
})

/* ── 预留位 / 目标版 开关 —— 默认关闭 ─────────────────────────────────────── */
const slotBtn = document.getElementById('slotBtn')
slotBtn.addEventListener('click', () => {
  const on = document.body.classList.toggle('slots')
  slotBtn.classList.toggle('on', on)
  slotBtn.textContent = on ? '隐藏预留位 / 目标版' : '显示预留位 / 目标版'
})
</script>
</body>
</html>
