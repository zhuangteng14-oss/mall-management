   用户原话：「搜索 / 购物车 / 个人页**色彩过于单一（只有少量按钮和文字是青瓷绿，
   大块区域全是线条 + 留白）**」。搜索页对着这句话改两处：

   ① **立一条全页唯一的用色规则：「当前态 = 青瓷绿 50 底」。**
      落点三处（+hover 一处）：左树选中的二级分类 / 排序选中项 / 分页当前页 / 卡片 hover。
      底是 `--brand-tint`，ΔE00/白 = **7.30** —— 挑它有据：同批 token 里 `--surface-2` 只有
      **2.63**（拿它做选中态＝看不出来，v4 之前就是这么错的），`--zone` **2.71** 同理。
      更关键的一条**语法更正**：v4 之前「选中」是用**绿色文字**表示的，而文字色该管**层级**、
      底色才管**状态**。两者混用会让人在同一条栏里同时看见两处「绿」而分不清哪个是选中
      （分类树里已经栽过一次，见下 ⑤）。
   ② **删掉左栏那根 `border-right`。** 依据是四层语法：左栏 ⇄ 主栅格是**同级**两栏，
      同级用**间距**、分区才用面/大留白，**线只该管分组**。同批稿里 UserCenter 的两个
      `.uc-menu` 就是「无 border、靠 flex 间距」—— 搜索页这根竖线是**内部不一致**，
      而且它是又一根加在「大块区域全是线条」上的线。⇒ 改为纯大留白
      （`--s5` 栏内 + `--s6` 栅格 gap ≈ 52px 空白带）。
      ⚠️ 分类树的**缩进引导线**（`.cat-l ul{border-left}`）**保留** —— 那一层是组内层级，
      正是「线」该在的位置。

     那就撞上了「克制 > 堆砌」，且判据 B 给搜索页的用色口子**只有**卡片 hover 一处。
     ⇒ 判据 B 说什么就做什么，不为了「统一」硬加色（用户原话）。

  ── Q6 这份稿我为什么这样改？和上一版的根本差异是什么？（v5 新增）──────────
   **根本差异：v4 把「选中」当文字色问题，v5 把它当底色问题。**
     v4：选中项 = 绿色加粗文字（三个落点各自写一遍）。后果有二 ——
     ① 文字色被同时用来表达「层级」和「状态」，两种含义打架（分类树 ⑤ 就是栽在这上面）；
     ② 静态截图下「绿字」和「黑字」的强度差很弱，用户读到的就是「大块区域全是线条 + 留白」。
     v5：选中项 = `--brand-tint` 底色（ΔE00 7.30，看得见），文字色**退回只管层级**。
     一条规则（当前态 = 青瓷绿 50 底）统摄四处落点，而不是四处各写各的。
   次要差异：删掉左栏 `border-right`（线不该管同级两栏）。
   ⚠️ 一句话检验：**v4 的搜索页，把浏览器调成灰度，几乎分不出哪个分类是选中的；
      v5 的能分出来**（底色块比文字色重得多）。这是这一版真正买到的东西。

  ── 参考：淘宝 / 京东搜索结果页（左分类树 + 两行排序筛选带 + 自适应栅格 + 居中分页）、
     Zalando 列表页（分类树可收起、筛选与排序分带）。
  ═══════════════════════════════════════════════════════════════════════════════
-->

<style>

/* ── 预览条 + 预留位可视化：只是看稿工具，不进 Vue ─────────────────────────── */
.bar{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;

.bar-t{font-weight:var(--fw-semi);color:var(--nav-tx-hi);margin-right:var(--s3)}

body.slots [data-slot]::after,body.slots [data-future]::before{

  border-radius:var(--r1);color:var(--bg);z-index:5;white-space:nowrap}
body.slots [data-slot]::after{content:attr(data-slot);left:8px;background:var(--warning)}
body.slots [data-future]::before{content:attr(data-future);right:8px;background:var(--info)}
/* ⚠️ 这一段 v5 **重写过** —— 上一版留在这里的是一份**已被推翻的测量**，且与下面两行注释自相矛盾
   （这里写「角标 323px、加宽到 260px 没用」，下面写「237px」）。实测（1440 视口，
   **`document.fonts.ready` 之后再量**）：
     · 角标自然宽 **238px**，从 x=162 起 ⇒ 占 [162, 400]
     · 左栏右缘 **414** ⇒ 栏内放得下（余 14px）；主区左缘 **446** ⇒ **净空 46px**，压不到排序条
     · 渲染高度 = 一个 line-height(14.17px) ⇒ **单行、没换行**
   ⇒ 结论：260px 栏宽本来就够，**不需要换挂法、也不需要换行**。
     下面那条 `max-width:244px` + `white-space:normal` 是**护栏**（238 < 244，当前不触发），
     只为防以后改文案又伸出去 —— 不是修复某次已发生的溢出。
   ⚠️ 教训：这件小事我**目测过两次**（先读成 242px、后读成 323px），两次都不作数，
     第二次还据此写进头注说「加宽没用」。238 是 `getBoundingClientRect` 量出来的。
     ⚠️ 并且**必须等字体落定**：同一枚角标在字体没加载完时量出的是 221px。
     凡带像素数的结论，先量、且等 `fonts.ready` —— 否则改口一次就要再改一次。 */
body.slots .cat[data-slot]::after{white-space:normal;line-height:1.35;max-width:244px}
/* ⚠️ 分类树这一处**两枚角标会撞**：slot 角标占 [162,400]、future 角标右对齐到栏右缘占 [335,406]
   ⇒ 横向重叠 65px，而 `::after` 画在 `::before` 之上 ⇒ **蓝角标被整个盖住**（截图里根本看不见）。
   ⇒ 把 future 角标挪到下沿（下方是分类树之下的空白，不压任何内容）。
   ⚠️ 与 ChatRoom 的 `.slot-stack`「窄元素换下沿」是同一手法。
   ⚠️ 挪下沿的**只有 future 这一枚**；slot 角标留在上沿默认位（与其余 9 份稿一致）。 */
body.slots .cat[data-future]::before{top:auto;bottom:-11px;max-width:132px;text-align:right}

.nav-bar{display:flex;align-items:center;gap:var(--s5);height:60px;padding:0 var(--s7);

/* 页标题 */

/* 搜索框（主视觉）：56px，按钮嵌在框内 */
.search{margin-top:var(--s6);display:flex;align-items:center;max-width:760px;height:56px;
        border:1px solid var(--line-2);border-radius:var(--r3);background:var(--surface);

.search .go{margin-right:6px;height:44px;padding:0 var(--s6);border-radius:var(--r2);

/* ⚠️ 左栏 260px 是被 slots 角标**逼出来**的：分类树角标文案宽约 242px，

.grid-wrap{margin-top:var(--s6);display:grid;grid-template-columns:260px minmax(0,1fr);gap:var(--s6);align-items:start}
.main{min-width:0}

/* ── 左分类树 ─────────────────────────────────────────────────────────────── */
/* ⚠️ v5：这里原来有一根 `border-right:1px solid var(--line)`。
   删掉的理由是**四层语法**：左栏 ⇄ 主栅格是**同级**两栏（不是分区内分组），
   同级的分隔手段是间距、不是线；分区级才用大留白/面。同一批稿里
   UserCenter 的两个 `.uc-menu` 就是「无 border、靠间距」——搜索页这根线是内部不一致。

   媒体查询里 1120px 以下那条 `border-right:0` 一并删除（已无对象），
   竖向堆叠仍保留 `border-bottom`（那一层是**分区级**换行，用线是对的）。 */
.cat{padding-right:var(--s5)}
.cat-h{font-size:var(--fs-xs);color:var(--ink-3);margin-bottom:var(--s4)}
.cat-l,.cat-l ul{list-style:none;margin:0;padding:0}
.cat-l>li{border-bottom:1px solid var(--line);padding:var(--s3) 0}
.cat-l>li:first-child{border-top:1px solid var(--line)}
.lv1{display:block;font-size:var(--fs-sm);color:var(--ink-2);padding:var(--s1) 0}
.lv1:hover{color:var(--ink)}
/* ⚠️ 「已展开」和「已选中」必须是**两种**视觉语言，否则同一栏里会同时出现两处「绿+加粗」，
   读起来像两个都选中了（v4 第一轮截图一眼可见）。
   ⇒ 绿色+加粗**只留给选中**（`.on`，见下）；「已展开」的一级只是比其余一级深一档灰。 */
li.open>.lv1{color:var(--ink)}
.cat-l ul{margin-top:var(--s2);padding-left:var(--s3);border-left:1px solid var(--line)}
.cat-l ul a{display:block;font-size:var(--fs-xs);color:var(--ink-3);padding:3px 0}
.cat-l ul a:hover{color:var(--brand-ink)}
/* ⚠️ v5：**「当前态 = 青瓷绿 50 底」** 是全页唯一的一条用色规则，出现在三个地方：
     ① 左树里选中的**二级分类**（这里）  ② 排序里选中的项  ③ 分页的当前页
   依据判据 A/B：`--brand-tint` ΔE00/白 = **7.30**，是「看得见 + 釉色」的那一档
   （对比 `--surface-2` 的 2.63 —— 拿它做选中态等于看不出来）。
   ⇒ 这一条**替代了**原来「选中=绿色文字」的做法：文字色只管层级，底色才管状态。 */
.cat-l ul a.on{color:var(--brand-ink);font-weight:var(--fw-med);background:var(--brand-tint);
               border-radius:var(--r1);padding:3px var(--s2);margin-left:calc(var(--s2) * -1)}
.cat-more{padding-left:var(--s3);margin-top:var(--s2)}
.cat-more button{font-size:var(--fs-xs);color:var(--ink-3)}
.cat-more button:hover{color:var(--brand-ink)}
.cat-more .car{display:inline-block;width:0;height:0;border-left:4px solid transparent;
               border-right:4px solid transparent;border-top:5px solid currentColor;
               margin-left:4px;vertical-align:middle}

/* ── 排序 / 筛选条：去盒子，上下两条发丝线；**显式两行**，不靠 flex-wrap ────── */
.toolbar{display:flex;flex-direction:column;gap:var(--s3);
         padding:var(--s4) 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.trow{display:flex;align-items:center;gap:var(--s6);flex-wrap:wrap}
.tgroup{display:flex;align-items:center;gap:var(--s4)}
.tgroup>.lbl{font-size:var(--fs-xs);color:var(--ink-3);white-space:nowrap}

.sort{color:var(--ink-2);font-size:var(--fs-sm);padding:var(--s1) var(--s3);border-radius:var(--r1)}
.sort:hover{color:var(--ink)}
/* v5：选中态加 --brand-tint 底（与左树选中项、分页当前页同一条规则）*/
.sort.on{color:var(--brand-ink);font-weight:var(--fw-semi);background:var(--brand-tint)}
.sort[disabled]{cursor:not-allowed}
.range{display:flex;align-items:center;gap:var(--s2);font-size:var(--fs-sm)}
.range input{width:72px;height:32px;padding:0 var(--s2);border:1px solid var(--line-2);
             border-radius:var(--r1);background:var(--surface-2);color:var(--ink-2);text-align:center;
             font-variant-numeric:tabular-nums}
.range .dash{color:var(--ink-3)}
.pick{display:flex;align-items:center;gap:var(--s2);color:var(--ink-2);font-size:var(--fs-sm)}
.pick[disabled]{cursor:not-allowed}

.pick .car{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;
           border-top:5px solid currentColor;margin-left:2px}
.trow .right{margin-left:auto;font-size:var(--fs-xs);color:var(--ink-3);white-space:nowrap}

/* ── 商品栅格：auto-fill + 40px 行距（v2 从「等分六列 + 小间距」改过来的，保留）── */
.grid{margin-top:var(--s6);display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:40px 24px}
/* ⚠️ v5：卡片加 8px 内边距 + 等量负外边距 —— 这样 hover 的底色块才不会紧贴图边，
   而**栅格间距一个字没变**（负外边距把那 8px 还回去了）。
   ⚠️ 判据 B 原文：「搜索页 —— 卡片 hover 青瓷绿 50 底」。我照做，并且选 --brand-tint
   不是因为它好看，是因为实测 ΔE00/白 = 7.30 ⇒ **hover 会真的被看见**；
   原来的 `.card:hover .thumb{border-color:--line-2}` 只有 ΔE00 1.7，等于没反馈。 */
.card{display:block;padding:var(--s2);margin:calc(var(--s2) * -1);
      border-radius:var(--r2);transition:background .15s}
.card:hover{background:var(--brand-tint)}
/* 无图可放：底仍用 --img（tokens.css:81 就是为「商品图占位」定义的），
   只加一圈发丝边 ⇒ 读成「空图框」而不是一块死灰 —— 不另造一个更浅的灰 */
.thumb{aspect-ratio:1/1;border-radius:var(--r2);background:var(--img);border:1px solid var(--line)}
/* ⚠️ `min-height:3em` = 两行：否则一行名 / 两行名的卡片价格不在同一水平线上 */
.c-name{margin-top:var(--s3);font-size:var(--fs-sm);line-height:1.5;color:var(--ink-2);min-height:3em;
        display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* 价格三档：¥ 13 / 整数 24 宋体 / 小数 13 —— 三段同号时卡里没有对比 */
.c-price{margin-top:var(--s2);display:flex;align-items:baseline;color:var(--accent);
         font-variant-numeric:tabular-nums}
.c-price .sym{font-size:var(--fs-xs)}
.c-price .int{font-family:var(--font-display);font-size:var(--fs-lg);font-weight:var(--fw-med);line-height:1}
.c-price .dec{font-size:var(--fs-xs)}

/* ── 空态 ─────────────────────────────────────────────────────────────────── */
.empty{padding:var(--s8) 0;text-align:center;color:var(--ink-3)}
.empty .big{font-family:var(--font-display);font-size:var(--fs-lg);color:var(--ink-2);margin-bottom:var(--s3)}

/* ── 分页：发丝线文字按钮 ─────────────────────────────────────────────────── */
.pager{margin-top:var(--s8);display:flex;justify-content:center;align-items:center;gap:var(--s2)}
.pg{min-width:40px;height:36px;padding:0 var(--s3);border-radius:var(--r2);color:var(--ink-2);font-size:var(--fs-sm);
    font-variant-numeric:tabular-nums}
.pg:hover{background:var(--surface-2)}
/* v5：当前页也用 --brand-tint 底（与左树选中项、排序选中项同一条规则）。
   hover 仍留在 --surface-2：**hover 是瞬时反馈、当前页是状态**，两者不该同色。 */
.pg.on{color:var(--brand-ink);font-weight:var(--fw-semi);background:var(--brand-tint)}
.pg[disabled]{color:var(--ink-3);cursor:not-allowed}
.pg[disabled]:hover{background:none}

/* 1080：分类树**改横排**（与 GoodsAdd / GoodsUp 的 .uc-menu 同一套处理），主区吃满整宽。
   ⚠️ 不这么做的话，左 260px 会把主区压到约 520px，栅格掉到 2 列、卡片又宽又扁 ——
   与 1440 的观感不是同一张稿（Q3 第 ④ 条）。 */
@media (max-width:1080px){
  .grid-wrap{grid-template-columns:1fr;gap:var(--s5)}
  .cat{padding-right:0;border-bottom:1px solid var(--line);padding-bottom:var(--s4)}
  .cat-l{display:flex;flex-wrap:wrap;gap:0 var(--s5)}
  .cat-l>li{border-bottom:0;padding:var(--s2) 0}
  .cat-l>li:first-child{border-top:0}
  /* ⚠️ 横排时**二级分类整层收掉**，只留一级。
     第一版是把二级也摊平（缩进改 0）—— 截图一看层级彻底丢了：
     「耳机 / 音箱 充电配件」浮在「电子用品 生活用品」下面，读不出谁是谁的子项，
     反而比不显示更容易误读。⇒ 窄屏只留一级，这是响应式分类栏的通行做法。 */
  .cat-l ul,.cat-more{display:none}
}
</style>

function go(key) {
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('on', p.dataset.page === key))

}
