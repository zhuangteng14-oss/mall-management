  ── 难度分辨（用户 ★ 第 1 条）—— 本页最有价值的一处在这里 ────────────────────
  同样是「加一个标签页」，N 差了 6 倍：
    · 「待发货 / 已发货 / 全部」= **N=1**（只改 `OrderCenter.vue`）。
      为什么可能：`selectByMerchant` 把 `PayIf / DeliveryIf / ReceiveIf` **三个状态位全 SELECT 出来了**，
      而两条 SQL **都没有 LIMIT** ⇒ 商家的**全量订单本来就在前端**，
      `待发货 = PayIf=1 && DeliveryIf=0`、`已发货 = DeliveryIf=1 && ReceiveIf=0` 纯前端筛即可。
    · 「退款中 / 售后」= **N≥6**。状态机 3 位已用满 8 组且全具名 ⇒ 加第 4 位 = 加列（`mall_management_sql.sql`）
      + `OrderState` + `OrderStateMachine` + `OrderDao` + `OrderService` + `OrderController` + `OrderCenter.vue`。
  ⚠️⚠️ **这个 N=1 有保质期，必须在角标里说清**：它成立的**唯一前提是「没有分页」**。

     四个标签页**必须同时搬到后端**（N 从 1 变 4）。
     ⇒ 这两条是**同一个决定的两面**：先上分页再上标签页，N 是 4+4；反过来则是 1+4。

   ⚠️ **没有照抄** Linear / Stripe / Vercel，理由见《v5-配色分析.md》：

     · `stats`（105px）→ **面**（填色 100%，底色 #dbe3de，ΔE00/白 8.01）
     · `tbl`（564px）  → **线**（填色 4%，靠分组发丝线）
     ⇒ 分布 = 面×1 + 线×1 ⇒ **Q5 ✓ 有交替**
   ⚠️ 改前是 **✗ 同质：线×2**（stats 与 tbl **都**用线划界）—— 这一处是真修好的，
     而且**不需要突变对照就能看出因果**：两次唯一的差别就是 stats 的 `background` 与四条边线。
   ⚠️ 保留一句：本页有 8 个区高 < 70px（crumb / page-h / tabs / filter / bulk / pager …）
     被工具的阈值剔出分布。这不影响结论（真分区仍是 stats + tbl 两个），但要知道
     本页是「一叠细带」，工具只对其中最厚的两条投票。

  ── Q6 这份稿我为什么这样改？和上一版的根本差异是什么？（v5 新增）──────────
   **根本差异：v4 最白（92.65%），所以它最像一张「只有线条的表格」；v5 给它一个起点。**

/*    上距 --s5(24)：角标净空 24-11-17+11 = 7px ✔（实测过，不是目测） */
.filter{margin-top:var(--s5);display:flex;align-items:center;gap:var(--s5);flex-wrap:wrap;
        padding-bottom:var(--s4)}
.fld{display:flex;align-items:center;gap:var(--s2);font-size:var(--fs-xs);color:var(--ink-3)}
.fld input{width:126px;height:32px;padding:0 var(--s3);border:1px solid var(--line-2);
           border-radius:var(--r1);background:var(--surface);color:var(--ink);font-size:var(--fs-sm)}
.fld input::placeholder{color:var(--ink-3)}
.fld .til{font-style:normal;color:var(--ink-3)}
.acts{margin-left:auto;display:flex;gap:var(--s3)}
.btn{padding:0 var(--s4);height:32px;border:1px solid var(--line-2);border-radius:var(--r1);
     font-size:var(--fs-sm);color:var(--ink-2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--bg)}

/* ── ④ 批量操作条：与筛选栏**同一行带状语义**，靠一条发丝线隔开 */
.bulk{margin-top:var(--s4);display:flex;align-items:center;gap:var(--s5);
      padding:var(--s3) 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
      font-size:var(--fs-xs);color:var(--ink-3)}
.bulk .sel{color:var(--ink-2)}
.bulk .sel b{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.bulk .sp{margin-left:auto}

/* 勾选框：目标版是真实控件，后端无批量端点 ⇒ 一律 disabled + title，不挂 data-slot
   ⚠️ 18px 与 ShoppingCart-customer.html 的 `.ck` **同尺寸**（跨页共性组件）。 */
.ck{position:relative;width:18px;height:18px;flex:none;border:1px solid var(--line-2);border-radius:var(--r1);background:var(--surface)}
.ck[disabled]{cursor:not-allowed}
/* ⚠️ v5：补上「已勾选」态 —— 与 `ShoppingCart-customer.html` 的 `.ck.on` **逐字同款**。
   第 352 行已经把这两页的 `.ck` 登记为「跨页共性组件」，已选态必须跟着共用，
   否则同一枚控件在两页会长得不一样。
   改动范围**只有「商家购物车」视图**（`data-page="cart"`）：它写着「已选 3 件 / 共 3 件」、
   合计 ¥347.00（= 129+149+69，全选之和），而三枚勾选框却是空的 —— 数据说全选、控件说没选。
   ⚠️ 「订单处理」视图（`data-page="order"`）**不动**：它写的是「已选 **0** 单」（第 575 行字面量），
      与空框本来自洽 —— 不能因为「统一」把一处对的也改了。
   勾用两条边框转 45° 画，不用 `✓` 字形（自托管子集无该码位）。 */
.ck.on{border-color:var(--brand);background:var(--brand)}
.ck.on::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:9px;
              border-right:2px solid var(--bg);border-bottom:2px solid var(--bg);transform:rotate(45deg)}

/* ── 表格：9 列。⚠️ 商品列 `minmax(0,1fr)` 吃满余量（Q3 第 ① 条）
      列宽是**量出来的**，不是估的：1440 下 wrap 内容宽 1132，固定列合计 732 + 8 道 gap×16=128，
      商品列得 272。时间列给 128 是因为 `2026-10-05 21:28` 在 mono 12px 下量得 115.2px，
      最早给的 104px **装不下 ⇒ 折成两行**（截图读回时抓到，见 Q3 第 ⑦ 条）。 */
.tbl{margin-top:var(--s4)}
.thead,.trow{display:grid;
  grid-template-columns:28px 56px minmax(0,1fr) 132px 88px 92px 92px 128px 116px;
  align-items:center;gap:var(--s4)}
.thead{padding-bottom:var(--s3);font-size:var(--fs-xs);color:var(--ink-3);
       border-bottom:1px solid var(--line-2)}
.trow{padding:var(--s4) 0;border-bottom:1px solid var(--line)}
.r{text-align:right}
.cen{text-align:center}
.thumb{width:56px;aspect-ratio:1/1;border-radius:var(--r1);background:var(--img);border:1px solid var(--line)}
.pn{min-width:0;font-size:var(--fs-sm);color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oid{font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--ink-2);
     font-variant-numeric:tabular-nums}
.buyer{font-size:var(--fs-xs);color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.money{text-align:right;font-family:var(--font-display);font-size:var(--fs-md);
       font-weight:var(--fw-med);font-variant-numeric:tabular-nums}
.time{font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--ink-3);
      font-variant-numeric:tabular-nums;white-space:nowrap}

/* 状态 chip：五态一套语言 —— 同字号 / 同内距 / 同圆角，**只有色相不同**
   （Q2 就是靠这一行答的）。用 `-ground` 底 + 同色字，不用描边：
   描边在 12px 字下会糊，而底色块在这个尺寸下是"徽标"不是"色块铺满"。 */
.st{display:inline-block;padding:2px 8px;border-radius:var(--r1);
    font-size:var(--fs-xs);line-height:1.6;white-space:nowrap}
.st.draft{background:var(--surface-3);color:var(--ink-2)}
.st.warn{background:var(--warning-ground);color:var(--warning-deep)}
.st.info{background:var(--info-ground);color:var(--info-deep)}
.st.err{background:var(--danger-ground);color:var(--danger-deep)}
.st.ok{background:var(--success-ground);color:var(--success-deep)}
/* ⚠️ 下单时间在「已完成」行是空的 —— 既有缺陷，`selectByMerchant` 的 completed 分支
   不 SELECT CreateTime（OrderDao:138）。用**一个普通长破折号**表示「此处无值」，
   并且这个「无值」是**库层缺字段**、不是「这一单没有时间」——
   差别靠 `title` 与头注交代。
   （上一版在这里画了一条 52px 的短横线，渲染出来是「— —」，像打字错误；已删。） */
.dash{color:var(--ink-3)}
.send{font-size:var(--fs-sm);color:var(--brand-ink);font-weight:var(--fw-med)}
.send:hover{color:var(--brand)}

/* ── ⑤ 分页 */
.pager{margin-top:var(--s5);display:flex;align-items:center;gap:var(--s2);font-size:var(--fs-xs);color:var(--ink-3)}
.pager .pg{min-width:32px;height:32px;line-height:30px;padding:0 var(--s2);text-align:center;
           border:1px solid var(--line-2);border-radius:var(--r1);color:var(--ink-2);
           font-variant-numeric:tabular-nums}
.pager .pg.on{border-color:var(--brand);color:var(--brand-ink);font-weight:var(--fw-semi)}
.pager .pg[disabled]{color:var(--ink-3);cursor:not-allowed}
.pager .tot{margin-left:auto}

/* ── 商家购物车 pane：与 `ShoppingCart-customer.html` **逐字同款**
      （同一 ShoppingCart.vue ⇒ 形态必须一致；v2 的「右栏 sticky」已废弃）
      店铺分组 + 发丝线表行 + 吸底结算栏
   ⚠️ v5 收尾（改 2）：用户判据「**换个顶栏就是同一页**」。逐条核过两稿的这套规则，
      值层面**只剩类名前缀不同**；下面 7 条是这次修掉的**真差异**，每条都标了原因：
        ① `.paybar` 底色 `--surface`+上边线 → **`--glaze-deep`**（客户稿已是釉面）
           —— 这是**唯一肉眼可见**的一条，改前两稿的吸底栏一个是绿面一个是白面带线；
        ② `.cnm` 补 `min-width:0`（客户稿 `.nm` 一直有）—— 缺它时栅格项最小宽度是
           `auto`，长商品名会**溢出名称列**而不是走 `.cnm .t` 的省略号；实测当前数据名短、
           没露出来，属**潜伏**缺陷；
        ③ `.qty .b` 补 `font-variant-numeric:tabular-nums`；
        ④ 补 `.cop button[disabled]{cursor:not-allowed}`（客户稿 `.op button[disabled]` 有）；
        ⑤⑥ `.paybar .cnt` → `.paybar .sel .cnt`、`.paybar .d` → `.paybar .sums .d`
           （两稿选择器写法对齐；已核 `.cnt`/`.d` 在**本页只出现在这个 pane 里**，改名无外溢）；
        ⑦ 客户稿 `.ck` 补 `flex:none`（本页早就有）—— 18px 定宽控件，实测无位移，是**同形**而非改版。
      ⚠️ **没改的**（说清为什么，不是忘了）：
        · 类名前缀 `.crow/.cthumb/.cnm/.csub/.cop` **保留**，不做「去 c」重命名：
          本页 `:458` 的 `.thumb`（原记 `:441`）是**订单列表的 56px 缩略图**，客户稿的 `.row .thumb` 是
          **购物车的 64px 缩略图**，同名不同尺寸 —— 重命名会**撞车并改坏订单表**。
          所以「同一套」在两稿里是**值相同、名字带前缀**；核对方法是把两段规则抽出来
          归一化前缀后逐行比，不是直接 `diff` 两个文件。
        · `.pledge` /「编辑」/ 猜你喜欢：**本轮补了前两条**（`.pledge` 见下面那条注释；
          `.edit` 见页面级 CSS 段那条），**只留「猜你喜欢」不改** —— 它是**页面级**模块
          （商品推荐，不属购物车），与本 pane 是否同形无关。 */
.shops{margin-top:var(--s6)}
.shop{border-top:1px solid var(--line-2)}
.shop-head{display:flex;align-items:center;gap:var(--s3);padding:var(--s4) 0 var(--s3)}
.shop-nm{font-size:var(--fs-sm);font-weight:var(--fw-med);color:var(--ink)}
.shop-nm .badge{margin-left:var(--s2);font-size:var(--fs-xs);font-weight:var(--fw-reg);color:var(--ink-3)}
.visit{margin-left:var(--s2);font-size:var(--fs-xs);color:var(--ink-3)}
.visit:hover{color:var(--brand-ink)}
.list-head,.crow{display:grid;grid-template-columns:28px 64px minmax(0,1fr) 88px 104px 112px 48px;
                 align-items:center;gap:var(--s4)}
.list-head{padding-bottom:var(--s3);font-size:var(--fs-xs);color:var(--ink-3)}
.list-head .c-num,.list-head .c-sub,.list-head .c-op{text-align:right}
.crow{padding:var(--s4) 0;border-bottom:1px solid var(--line)}
.cthumb{width:64px;aspect-ratio:1/1;border-radius:var(--r1);background:var(--img);border:1px solid var(--line)}
.cnm{min-width:0}
.cnm .t{font-size:var(--fs-md);font-weight:var(--fw-med);line-height:1.35;color:var(--ink);
        overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnm .spec{margin-top:var(--s1);font-size:var(--fs-xs);color:var(--ink-3)}
.unit{text-align:right;font-size:var(--fs-sm);color:var(--ink-3);font-variant-numeric:tabular-nums}
.qty{display:flex;align-items:center;justify-content:flex-end;gap:var(--s2)}
.qty .b{width:26px;height:26px;border:1px solid var(--line-2);border-radius:var(--r1);color:var(--ink-2);
        line-height:1;font-variant-numeric:tabular-nums}
.qty .b[disabled]{color:var(--ink-3);cursor:not-allowed}
.qty .v{min-width:24px;text-align:center;font-size:var(--fs-sm);font-variant-numeric:tabular-nums}
.csub{text-align:right;font-family:var(--font-display);font-size:var(--fs-lg);
      font-weight:var(--fw-med);font-variant-numeric:tabular-nums}
.cop{text-align:right}
.cop button{font-size:var(--fs-xs);color:var(--ink-3)}
.cop button[disabled]{cursor:not-allowed}
/* 服务承诺条（v5 收尾改 2 补齐）：与 `ShoppingCart-customer.html` 的 `.pledge` **逐字同款**。
   ⚠️ 与 `ProductPage.html` 的 `.promise` **有意不同**：那边四条发丝线全删了（右栏升成釉面后
   `--line` 铺在釉面上整根消失）；本页与客户购物车都在白底上，线看得见，就留着。
   ⚠️ 所以「跨页共性组件」这条登记约束的是**文案**，不是样式 —— 这是那份稿自己的原话。 */
.pledge{margin-top:var(--s2);margin-bottom:var(--s2);padding:var(--s4) 0;
        border-top:1px solid var(--line);border-bottom:1px solid var(--line);
        display:flex;gap:var(--s8);flex-wrap:wrap;font-size:var(--fs-xs);color:var(--ink-2)}
.pledge span::before{content:"·";color:var(--brand);margin-right:var(--s2);font-weight:var(--fw-semi)}
.shop-foot{display:flex;align-items:center;justify-content:flex-end;gap:var(--s4);
           padding:var(--s3) 0 var(--s5);border-top:1px solid var(--line);
           font-size:var(--fs-xs);color:var(--ink-3)}
.shop-foot .v{font-family:var(--font-display);font-size:var(--fs-md);font-weight:var(--fw-med);
              color:var(--ink);font-variant-numeric:tabular-nums}
/* ⚠️ v5 收尾（改 2 ①）：底色 `--surface` → **`--glaze-deep`**，并**删掉 `border-top`**。
   改前客户稿的吸底栏是釉面、本页是白面加一根上边线 —— 这是两稿**唯一肉眼可见**的差异。
   面已经承担了分区，再叠一根线就是「同一种手段跨层级复用」（线留给分组），
   理由与客户稿 «吸底结算栏» 段 `:415-428`（原记 `:409-422`）逐字相同。 */
.paybar{position:sticky;bottom:0;z-index:20;background:var(--glaze-deep)}
.paybar-in{max-width:1180px;margin:0 auto;padding:var(--s4) var(--s5);
           display:flex;align-items:center;gap:var(--s5)}
.paybar .sel{display:flex;align-items:center;gap:var(--s3);font-size:var(--fs-sm);color:var(--ink-2)}
.paybar .sel .cnt{color:var(--ink-3);font-size:var(--fs-xs);font-variant-numeric:tabular-nums}
.paybar .sums{margin-left:auto;display:flex;align-items:baseline;gap:var(--s4)}
.paybar .sums .d{font-size:var(--fs-xs);color:var(--ink-3);font-variant-numeric:tabular-nums}
.total{display:flex;align-items:baseline;gap:var(--s2)}
.total .k{font-size:var(--fs-sm);color:var(--ink-2)}
.total .v{font-family:var(--font-display);font-size:var(--fs-xl);font-weight:var(--fw-med);
          line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.total .v i{font-style:normal;font-size:var(--fs-sm);margin-right:2px}
.go{height:48px;padding:0 var(--s7);border-radius:var(--r2);background:var(--brand);
    color:var(--bg);font-size:var(--fs-md);font-weight:var(--fw-med);white-space:nowrap}
/* ⚠️ v5：**推翻**原来的 `.go[disabled]{background:var(--surface-3);color:var(--ink-3)}`。
   这条与 `ShoppingCart-customer.html` 的同名规则是**逐字相同的复制件**
   （两处 `.go` 连 `title="待 C3〈购物车〉——结算流程无端点"` 都一样），
   而它把「商家购物车」里的主行动按钮涂成灰盒 —— 在整条已选 / 合计都算好的结算栏上，
   灰盒读起来像「这单出问题了」。
   推翻依据是那两页**共同**的房规（`ShoppingCart-customer.html` 头注第 88 行）：
     「逐行的重复控件一律**只 `disabled` + `title`**」——
   全批 `[disabled]` 也几乎都只改 cursor（`GoodsSelect` 的 `.sort`/`.pick`、
   `ProductPage` 的 `.ghost`、`UserCenter` 的 `.tiles`/`.sec-h`）。
   ⇒ 保留 `--brand` 实底（目标态长什么样就画什么样），「无端点」由
     `disabled` + `title` + `cursor:not-allowed` 承担。
   ⚠️ **两页必须同时改**，否则就是把「复制件一致」变成「复制件不一致」。 */
.go[disabled]{background:var(--brand);color:var(--bg);cursor:not-allowed}
/* ⚠️ 吸底条在 slots 态会被 `body.slots [data-slot]{position:relative}` 顶掉 sticky
   ⇒ 显式还回来（购物车稿踩过，README 有记） */
body.slots .paybar[data-slot]{position:sticky}

/* ── 空态 ─────────────────────────────────────────────────────────────────── */
.empty{padding:var(--s8) 0;text-align:center}
.empty .big{font-family:var(--font-display);font-size:var(--fs-lg);color:var(--ink-2)}
.empty .p{margin-top:var(--s3);font-size:var(--fs-sm);color:var(--ink-3)}
.empty .go2{display:inline-block;margin-top:var(--s5);height:40px;line-height:40px;padding:0 var(--s6);
            border:1px solid var(--line-2);border-radius:var(--r2);color:var(--ink-2);font-size:var(--fs-sm)}

/* ── 窄屏 ─────────────────────────────────────────────────────────────────── */
@media (max-width:1120px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat:nth-child(3),.stat:nth-child(4){border-top:1px solid var(--line);margin-top:0}
  .stat:nth-child(3){border-left:0;padding-left:0}
  .stat:nth-child(3),.stat:nth-child(4){padding-top:var(--s4)}
  /* ⚠️⚠️ 第一版这里把表格**重排成订单卡**（每单 7 行、隐掉表头、给每个字段加 "订单号 "/"买家 "
     前缀）。1080 截图读回后确认是**两处真缺陷**，已整块删除：
       ① 一单撑到约 390px 高，6 单把页面拉到 2900px —— 而订单列表的价值恰恰是**一屏能扫多少行**；
       ② 「状态」chip 掉到了最左边一列：我写的选择器是 `.trow .st`，可 chip 外面还包着
          `<div class="cen">` —— **真正的网格项是那个 div**，它没被指派位置就自动落位了。
     根因是落笔时的假设「**9 列一屏摆不下**」**从来没量过**。量一下：1080 下 wrap 内容宽 1032，
     收紧后固定列 660 + 8 道 gap×12 = 756 ⇒ **商品列仍有 276px**，摆得下。
     ⇒ 窄屏**只收紧、不改结构**：列不变、表头不隐、不加前缀。
       两种宽度下是**同一张表**，因此没有"卡片模式"那一整套需要单独维护、单独复核的规则。
       唯一保留的折行是吸底结算栏（1080 下确实一行放不下，且折行后仍然清楚）。 */
  .thead,.trow{grid-template-columns:24px 56px minmax(0,1fr) 104px 72px 92px 104px 116px 92px;
               gap:var(--s3)}
  .money{font-size:var(--fs-sm)}
  .filter{gap:var(--s3)}
  .fld input{width:112px}
  /* ⚠️ v5 收尾（改 2）：这一小段是本轮**最实质**的一处两稿分歧，而且**只有出 1080 截图才看得见**。
     改前这里写的是「列头留着，7 列一起收紧」（`.list-head,.crow` 收列宽 + `.csub` 降到 `--fs-md`），
     而客户稿在**同一个断点**上是「**隐掉列头 + 商品行重排成三行**」并给每个数加前缀标签。
     ⇒ 1440 下统一了、1080 下又不统一 —— 判据「换个顶栏就是同一页」在窄屏直接不成立。
     改法：**整段照搬客户稿**（被用户点名的那张稿就是客户稿）。
     ⚠️ 这与商家订单表那套（`.thead/.trow`「只收紧、不改结构」，见上一段长注释）**不冲突**：
        订单表是 9 列的数据表，要的是「一屏能扫多少行」；
        购物车行是 7 列的一条选购记录，要的是「一件商品读得清楚」。两者不是同一种读法。 */
  .list-head{display:none}
  .crow{grid-template-columns:28px 64px minmax(0,1fr) auto;
        column-gap:var(--s5);row-gap:var(--s4);align-items:center}
  .crow .ck{grid-area:1/1/2/2;align-self:start;margin-top:2px}
  .crow .cthumb{grid-area:1/2/2/3}
  .crow .cnm{grid-area:1/3/2/5}

<script>
/* ⚠️ 本段整体是一个 **JS 模板字符串** ⇒ 里面的 HTML 注释**不许出现反引号**
   （ProductPage 踩过：一个反引号提前截断字符串 ⇒ 整页白屏）。 */

/* ── 订单行 ──────────────────────────────────────────────────────────────────
   状态是**三个 int 位推出来的**，不是 varchar 列 —— `selectByMerchant` 已经把
   PayIf / DeliveryIf / ReceiveIf 三位全 SELECT 出来了，所以状态列是 0 处改动的真功能。
   下表逐行标出它对应 `OrderState.java` 的哪个枚举常量。
   [商品, 订单号, 买家, 金额, PayIf, DeliveryIf, ReceiveIf, 下单时间(空=既有缺陷), 可发货]
   ────────────────────────────────────────────────────────────────────────── */
const ORDERS = [
  ['无线蓝牙耳机 声谷标准版', 'ZHJC53759811', 'zhuang_ke', 297.00, 1, 0, 0, '2026-10-05 21:28', true],
  ['便携充电宝 20000mAh',   'LFZW31654220', 'li_ming',   223.28, 1, 0, 0, '2026-10-05 20:40', true],
  ['不锈钢保温杯 500ml',    'DOZD81289614', 'wang_f',     40.00, 1, 1, 0, '2026-10-04 00:48', false],
  ['有机全麦面包 每日鲜',   'YYRG19302319', 'zhao_q',     57.71, 1, 0, 1, '2026-10-03 16:19', false],
  ['陶瓷马克杯 350ml',      'NFXC57789451', 'sun_lin',     2.00, 0, 0, 0, '2026-10-02 17:01', false],
  ['桌面收纳盒 三层抽屉',   'QZEQ72210207', 'zhou_y',     11.00, 1, 1, 1, '',                false]
]

/* 三位 → 状态：与 `OrderState.java` 的 5 个合法常量一一对应，一步不多 */
const STATE_OF = {
  '0,0,0': ['draft', '未付款'],
  '1,0,0': ['warn',  '待发货'],
  '1,1,0': ['info',  '已发货'],
  '1,0,1': ['err',   '已收货·未发货'],
  '1,1,1': ['ok',    '已完成']
}

const yuan = n => n.toFixed(2)

document.getElementById('orows').innerHTML = ORDERS.map(o => {
  const [name, oid, buyer, price, pay, deliv, recv, time, canSend] = o
  const [cls, label] = STATE_OF[[pay, deliv, recv].join(',')]
  /* ⚠️ 已完成行的下单时间是**空的** —— 不是漏画：`selectByMerchant` 的 completed 分支
     不 SELECT CreateTime（OrderDao:138）。用 `.gap` 画一个显式的占位横线 + title 说明，
     留白会被读成「我漏了」。 */
  const timeCell = time
    ? '<span class="time">' + time + '</span>'
    : '<span class="dash" title="既有缺陷：OrderDao.selectByMerchant 的 completed 分支不 SELECT CreateTime（:138），该行这一列在库里就没取出来 —— 不是「这一单没有时间」。修它 = 改响应字段集，属另一笔">—</span>'
  return '<div class="trow">' +
    '<button class="ck" disabled title="待 C3〈订单〉——行勾选无端点（≥4 处，超档）"></button>' +
    '<div class="thumb"></div>' +
    '<div class="pn" title="' + name + '">' + name + '</div>' +
    '<div class="oid">' + oid + '</div>' +
    '<div class="buyer">' + buyer + '</div>' +
    '<div class="money">¥' + yuan(price) + '</div>' +
    '<div class="cen"><span class="st ' + cls + '">' + label + '</span></div>' +
    timeCell +
    '<div class="op r">' + (canSend
      ? '<button class="send" title="现有端点 order.orderDeliveryIfUp（endpoints.js:58）——本页唯一不禁用的按钮">发货</button>'
      : '<span class="dash">—</span>') + '</div>' +
    '</div>'
}).join('')

/* ── 页面上的每个数都从 ORDERS 推出来，一个都不手写 ────────────────────────
   ⚠️ 上一版这里是手写的 12/5/48/3 与「71 单」，而表格只摆 6 行 ⇒
      标题说 6 单、概览说 12 单待发货、分页说共 71 单 —— **三个数互相打架**。
      购物车稿已经因为「手写的合计与摆出来的行对不上」翻过一次车，
      这条判据是那次的直接产物：**凡是另一个数算得出来的数，都不许手写**。 */
{
  const st = o => STATE_OF[[o[4], o[5], o[6]].join(',')][0]
  const cnt = k => ORDERS.filter(o => st(o) === k).length
  document.getElementById('k-draft').textContent = cnt('draft')
  document.getElementById('k-warn').textContent  = cnt('warn')
  document.getElementById('k-info').textContent  = cnt('info')
  document.getElementById('k-ok').textContent    = cnt('ok')
  document.getElementById('t-all').textContent   = ORDERS.length
  document.getElementById('t-warn').textContent  = cnt('warn')
  document.getElementById('t-info').textContent  = cnt('info')
  document.getElementById('t-ok').textContent    = cnt('ok')
  /* 「全部」= 6 行 = 表格行数；概览四卡互不重叠地覆盖 4 个正常态，
     第 5 个合法态（已收货·未发货，异常态）只在表格里出现 ⇒ 6 = 1+2+1+1+1 ✔ */
  document.getElementById('oc-count').textContent =
    '共 ' + ORDERS.length + ' 单 · 待处理 ' + ORDERS.filter(o => o[8]).length + ' 单'
  const per = 20
  document.getElementById('pg-tot').textContent =
    '共 ' + ORDERS.length + ' 单 · 每页 ' + per
  console.log('[order-center] 订单', ORDERS.length, '· 各态', ['draft', 'warn', 'info', 'err', 'ok'].map(k => k + ':' + cnt(k)).join(' '))
}

/* ── 商家购物车（与 ShoppingCart-customer.html **同源同款**）────────────────
   ⚠️ 两条路由（/merchant/order 与 /merchant/order/cart）都由 `OrderPane.vue` 按
      `meta.orderTab` 在 `OrderCenter.vue` 与 `ShoppingCart.vue` 之间二选一渲染 ——
      **同一个 ShoppingCart.vue** ⇒ 本 pane 的形态必须与客户购物车稿一致，
      否则同一份组件会在两个上下文里长成两个样子。
   ⚠️ 本 pane 只画两稿**共享**的那块骨架（店铺分组 + 商品行 + 店铺小计 + 吸底结算栏），
      **不复画**服务承诺条与猜你喜欢：那两块在 ShoppingCart-customer.html 里有完整版，
      在这里再画一遍只会制造第二处需要同步的地方。
      —— v2 这里画的是「左列表 + 右栏 sticky 小结」两栏，已与客户稿的单栏 + 吸底**分歧**，
         v4 改回一致形态。改一处必须两处一起改。 */

]

/* ⚠️ 本段整体是 JS 模板字符串 ⇒ 里面的 HTML 注释**不许出现反引号** */
const mcRow = ([nm, spec, unit, qty]) => `
  <div class="crow">
    <button class="ck on" disabled title="待 C3〈购物车〉——勾选无端点（共同基线 4 处，超档）"></button>
    <div class="cthumb"></div>
    <div class="cnm"><div class="t">${nm}</div><div class="spec">规格：${spec}</div></div>
    <div class="unit">¥${yuan(unit)}</div>
    <div class="qty">
      <button class="b" disabled title="待 C3〈购物车〉——数量递减无端点（共同基线 4 处，超档）">−</button>
      <span class="v">${qty}</span>
      <button class="b" disabled title="待 C3〈购物车〉——数量递增无端点（共同基线 4 处，超档）">+</button>
    </div>
    <div class="csub">¥${yuan(unit * qty)}</div>

  </div>`

document.getElementById('cshops').innerHTML = MCSHOPS.map(([shop, rows]) => {
  const sub = rows.reduce((s, r) => s + r[2] * r[3], 0)
  const n = rows.reduce((s, r) => s + r[3], 0)
  return `
  <div class="shop">
    <div class="shop-head">
      <button class="ck on" disabled title="待 C3〈购物车〉——全选本店无端点（共同基线 4 处，超档）"></button>

      <a class="visit" title="待 C3〈店铺〉——无店铺表，无落点（≥5 处，超档；与 ProductPage.html 的商家卡是同一缺口）">进店逛逛 ›</a>
    </div>
    ${rows.map(mcRow).join('')}
    <div class="shop-foot">本店小计<span class="v">¥${yuan(sub)}</span></div>
  </div>`
}).join('')

/* 标题与吸底条的数**全部由 MCSHOPS 算出来**，不写死 */
{
  const all = MCSHOPS.flatMap(s => s[1])
  const n = all.reduce((s, r) => s + r[3], 0)
  const total = all.reduce((s, r) => s + r[2] * r[3], 0)
  document.getElementById('mc-count').textContent = n + ' 件商品 · ' + MCSHOPS.length + ' 家店铺'
  document.getElementById('mc-sel').textContent = '已选 ' + n + ' 件 / 共 ' + n + ' 件'
  document.getElementById('mc-goods').textContent = '商品总额 ¥' + yuan(total) + ' · 运费 免运费'

/* ── 切页 ─────────────────────────────────────────────────────────────────── */
const bar = document.querySelector('.bar')
function go(key) {
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('on', p.dataset.page === key))
  bar.querySelectorAll('button[data-page]').forEach(b => b.classList.toggle('on', b.dataset.page === key))
  window.scrollTo(0, 0)
}
bar.querySelectorAll('button[data-page]').forEach(b => b.addEventListener('click', () => go(b.dataset.page)))

/* ── 预留位 / 目标版 开关 —— 默认关闭 ─────────────────────────────────────── */
const slotBtn = document.getElementById('slotBtn')
slotBtn.addEventListener('click', () => {
  const on = document.body.classList.toggle('slots')
  slotBtn.classList.toggle('on', on)
  slotBtn.textContent = on ? '隐藏预留位 / 目标版' : '显示预留位 / 目标版'
})
</script>
