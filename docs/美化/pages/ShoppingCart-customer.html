  ── v5 改了什么（三处，对着用户的原话去）──────────────────────────────────
   用户原话：「搜索 / 购物车 / 个人页**色彩过于单一（只有少量按钮和文字是青瓷绿，
   大块区域全是线条 + 留白）**」。本页改前正好是这句话的标本：商品列表、承诺条、
   结算栏、猜你喜欢**四种分区全用线划界**，全页唯一的绿还被涂成了灰（见下 ③）。

   ① **吸底结算栏：`--surface` → `--glaze-deep`，并删掉 `border-top`。**
      这是本页唯一被补的「面」。理由：判据 C「**重要元素用色**」+「**分区用色块**」——
      结算栏是全页的事务锚点（合计 / 去结算都在它上面），它就该是这一页的主块。
      选 `--glaze-deep`(#dbe3de) 的据：ΔE00/白 = **8.01**、OKLCH C=0.011 H=159°
      —— 本批 token 里**唯一**同时满足「ΔE00/白 ≥ 4」与「彩度低到还像釉」的中性面
      （`--zone` 2.71 / `--surface-2` 2.63 / `--glaze-pale` 2.91 全在「看得见」线以下）。
      删 `border-top` 是四层语法：这一层已经是**分区**，分区用「面」划界，
      面之外再叠一根线＝同一种手段跨层级复用（线留给「分组」）。
      ⚠️ 面积代价约全页 **3.2%**（1440×80），不违反「克制 > 堆砌」。
      ⚠️ **诚实标注**：`measure-area.mjs` 把这 3.2% 计进了「**浅面（灰）**」而不是
      「青瓷绿」—— 因为它的分桶按 OKLCH 彩度切，`--glaze-deep` 的 C=0.011 够不上「有彩」。
      肉眼是淡青的（截图可见），但**按工具的尺子它算灰面**，不替它争这个名分。
   ② **勾选框改画成「已勾选」态**，修一处状态自相矛盾（改前数据说全选、控件说没选）。
      详见 `.ck.on` 那段注释。
   ③ **推翻 `.go[disabled]{background:var(--surface-3)}`**，改回 `--brand` 实底。
      详见 `.go[disabled]` 那段注释（依据是本文件自己的房规 + 全批只此一处例外）。

  ── ⚠️ v5 的一处**自我更正**：Q5 不是这次改动的理由 ────────────────────────
   我起初想把①写成「因为 Q5 判 ✗ 所以补面」。**做了突变对照才发现这是错的**：
     把 `.paybar` 改回白底 + `border-top` 重测 ⇒ 它被判为「**线**」（1 根，填色 10%）
     ⇒ 分布 = 留白×1 + 块×1 + **线×1** ⇒ **Q5 本来就是 ✓**。
   改后 = 留白×1 + 块×1 + **面×1** ⇒ Q5 仍 ✓。
   ⇒ 这次改动是**把该分区的划界手法从「线」换成「面」**，不是把 ✗ 翻成 ✓。
     真理由是用户的原话（线太多）+ 判据 C，与 Q5 无关。头注不许编因果。
   ⚠️ 同时记一个**工具的坑**（不是本页的问题）：`measure-hierarchy.mjs` 默认的取根启发式
     （`main > *` / `.content > *` / 兜底 `body > * > * > *`）在本页抓到的是**内层

     用 `--sel ".paybar, .shops, .rec, .pledge"` 指到真正的分区容器才是对的。
     ⚠️ 我**没有去改工具**让它默认通过 —— 只用它文档化的 `--sel`，并且两个数都写在这里。

  ── 三问自查（v4 第四条）──────────────────────────────────────────────────
    Q1 一眼能看出这是什么页吗？ ✔ 面包屑 +「购物车 · N 件商品」+ 按店铺分组的发丝线表行 +
       底部吸底结算栏 —— 是购物车的标准读法。**把订单号删掉**之后更像了（v2 还带着订单血统）。
    Q2 同模块不同状态视觉一致吗？ ✔ 两个视图共用同一套 `.crumb` / `.page-h` / `.card`；
       「空购物车」保留面包屑、标题与猜你喜欢，把列表区换成空态，**并摘掉吸底结算栏与服务承诺条**
       —— 这两块都以「有商品」为前提（见 ⑨）。
    Q3 有异常区吗？ ✔ 落笔时定下两条：
       ① 从两栏改成单栏后，列表吃满 1132px ⇒ 表行的 `minmax(0,1fr)` 名称列会被拉得很宽，
          而右侧的「单价/数量/小计/操作」四列仍是 88/104/112/48 —— 必须让名称列**吃掉全部余量**
          （`minmax(0,1fr)` 已经是这个语义），否则余量会被平摊到各列、数字列左右乱飘。
       ② 吸底条用 `position:sticky;bottom:0` 而**不是 `fixed`** —— fixed 要额外给正文
          `padding-bottom` 补偿，否则最后一行商品会被条子永久盖住；sticky 在**它自然位置到达时
          就落回文档流**，不存在遮挡。
       **截图读回后又抓到三条：**
       ③ 【真缺陷 / 机制坑】`.sum` 在 v2 就带 `data-slot` 且是 `position:sticky` ——
          而 `body.slots [data-slot]{position:relative}` 会**把 sticky 顶掉**。
          v2 看不出问题，只因为这块正好在页面顶部（滚到 0 时 sticky 与 relative 没差别）。
          吸底条在页面**底部**，一旦被顶成 relative 就会跳回文档流尾部、
          在 slots 态下**整个吸底效果消失** ⇒ 截图里一眼可见。
          ⇒ 加一条同选择器、更高优先级的规则把 sticky 还回来：
            `body.slots .paybar[data-slot]{position:sticky}`。
          ⇒ 教训：**slots 的 `position:relative` 与任何 sticky/fixed 挂点都会打架**，
            凡是要在 slots 态下保持定位的挂点，都得显式还原一遍。
       ④ 【**误判，已改正 —— 保留记录**】第一版在整页图里看到「吸底条压住服务承诺条下缘」，
          判成「吸底条角标（top:-11px）空间不够」，给承诺条加 `margin-bottom:24px` 去补。
          **实际原因不是 margin**：那是 ⑥ 说的 sticky 截图伪影 —— 吸底条被钉在布局视口底、
          盖在承诺条上。改成视口图 + `--eval` 后就没了。
          ⇒ 真净空来自 `.wrap{padding-bottom:var(--s8)}`（64px），比角标高得多，一直够。
          ⇒ 教训：**分不清「页面缺陷」和「截图伪影」时，先换一种截图方式复现一次再下结论**，
            否则会为一个不存在的问题改样式（而且改错了还看不出来，因为伪影没了）。
       ⑤ 【真缺陷，读回整页图才发现】承诺条**归属读反**：第一版上距 80px、下距 45px，
          离「猜你喜欢」比离商品列表更近 ⇒ 看起来像推荐区的副标题。
          承诺条是**购物车的尾** ⇒ 改成上紧下松（`margin-top:var(--s2)` / `.rec{margin-top:var(--s7)}`）。
          ⇒ 教训：**间距不是审美，是归属声明** —— 谁离谁近，读者就认为谁属于谁。
       ⑥ 窄屏（≤1120）下吸底条里的四件东西（全选 / 已选 / 合计 / 去结算）一行放不下 ⇒
          显式折成两行（第一行全选 + 已选，第二行合计 + 去结算），**不靠 flex-wrap** ——
          GoodsUp 踩过「wrap 折行位置随视口变」的坑。
       ⑦ 【截图伪影，不是页面缺陷，但必须处理】`shot.mjs` 的 `--full` 走 puppeteer
          `fullPage`，而它用 `captureBeyondViewport`：**布局视口仍是 900px**，只是往视口外多画。
          于是 `position:sticky;bottom:0` 的吸底条被钉在 y≈900 处，
          **后面的服务承诺条与猜你喜欢全跑到它下面去了** —— 整页图读起来像「结算栏插在中间」。
          ⇒ 整页图用 `--eval` 把 `.paybar` 临时改成 `position:relative`
            （保留 `::after` 的定位祖先，角标不跑），让它回到文档流末尾；
            吸底效果另出一张**视口图**（不带 `--full`、先 `window.scrollTo` 滚动）作证据。
          ⇒ 通用教训：**sticky/fixed 元素在整页截图里必然失真**，
            要么临时改定位、要么用视口图，不能拿整页图去评价吸底/吸顶。
       ⑧ 【探针盲区 —— 比本条缺陷本身重要】`.edit` 的角标溢出视口 31px、与另一枚角标互撞 6×15px，
          而 `check-badges.mjs` **两条都报 OK**：
            · 它沿**祖先链**找 `overflow != visible`，**从不与视口比较** ⇒ 看不见「被窗口裁」；
            · 它的 `boxes()` **逐个算盒，从不做两盒相交** ⇒ 看不见「两枚角标互撞」。
          查出来的办法只有一个：内联 `node -e` 把每枚角标按 `getComputedStyle(el,'::after')`
          的 top/left/right/width/height 换算成绝对矩形，再两两求交集（不落任何文件）。
          ⇒ 教训：**探针报 OK 只等于「它查过的那几件事 OK」，不等于「没问题」**。
            一个探针没有覆盖到的失效模式，它不会以「没查」的形式报出来，而是以「OK」的形式报出来
            —— 这是最危险的失败方式。用它之前先读一遍它在查什么（本页就是读了源码才发现的）。
       ⑨ 【真缺陷 · 判据误用】第一版在「空购物车」里也画了服务承诺条，理由写在注释里：
          「真实电商清空购物车后这些区块不会跟着消失」。
          ⚠️ **这句话是我自己编的，不是从任何平台上看到的。** 回看真实平台：空购物车就是
          「空态 + 去逛逛 + 猜你喜欢」三件，没有承诺条，也没有吸底结算栏。
          承诺条的指代对象是**车里的商品**；车空了，它就没有指代对象，
          悬在空态与推荐区之间只会被读成「空态的附属小字」。
          ⇒ 已删。
          ⇒ 教训：**「我觉得真实平台是这样」和「真实平台确实是这样」之间差一次核对**。
            这条判据（第一条）的全部价值就在这里 —— 一旦允许自己凭印象补理由，
            它就退化成 v2/v3 那种「从现有实现出发」的自洽，只是换了个说法。

  ── Q4 配色比例是否参考了成熟方案（v5 新增）──────────────────────────────
   ⚠️ **没有照抄** Linear / Stripe / Vercel，理由见《v5-配色分析.md》：
     那三家主色 OKLCH **C = 0.235 / 0.214 / 0.159**，我们 `--brand #3b7966` 只有 **0.072**，
     差 2~3 倍。「主色 ≤10% 面积」这条经验的前提是**主色够响**；前提不成立时照抄只会更单调。
   ⇒ 本页参照对象是**淘宝 / 京东购物车**（按店铺分组 + 店铺小计 + 底部吸底结算栏）——
     同样是「按页定参照」：购物车是**事务页**，密度中高，不是营销页。
   ⇒ 本页实测（1440·整页）：**留白 69.16% / 浅面（灰）28.77% / 青瓷绿 0.50% / 朱砂 0.24%**。
     改前是青瓷绿 **0.17%** / 灰面 **26.42%**（会话记录，非本地重测 ⇒ 按叙述记录标）。
     ⚠️ 绿涨得不多（+0.33pt），涨的全在「结算栏按钮 + 7 枚勾选框」这些**小面积实色**上；
     ⚠️ 而结算栏那 3.2% 的 `--glaze-deep` 面被量具算进了「浅面（灰）」，不算青瓷绿（见 v5 第①条）。

  ── Q5 同页分区视觉是否交替（v5 新增）──────────────────────────────────
   用 `--sel ".paybar, .shops, .rec, .pledge"` 指到**真正的分区容器**后实测：
     · `shops`（645px，商品列表）→ **留白**
     · `猜你喜欢`（1360px）        → **块**（20 张 `--img` 占位图，填色 56%，ΔE00/白 5.13）
     · `paybar`（80px）            → **面**（填色 100%，底色 #dbe3de，ΔE00/白 8.01）
     ⇒ 分布 = 留白×1 + 块×1 + 面×1 ⇒ **Q5 ✓ 有交替**
   ⚠️ 两个必须写下来的保留：
     ① **不传 `--sel` 时本页得 △** —— 默认取根启发式抓到内层 `.paybar-in`（自身无底色）
        把它判成「留白」。这是**工具的取节点坑**，不是本页的缺陷（见上面「自我更正」那段）。
     ② `shops` 被判「留白」也**偏宽**：商品行的分组发丝线挂在孙级 `.row` 上，
        而工具只扫「自身 + 直接子级」（第二版修正的自觉取舍）⇒ 数不到那些线。
        ⇒ 所以这一格的真实手法应是「线」而非「留白」。**我照工具的原样记录，不替它美化**。
     ③ `pledge`（承诺条，51px，上下两条发丝线）高 < 70px 被工具剔出分布 —— 它本来就是
        「分组」层用线，不该参与分区投票。

  ── Q6 这份稿我为什么这样改？和上一版的根本差异是什么？（v5 新增）──────────
   **根本差异：v4 是一张「没有重心的表格」，v5 让它有了一个重心。**
     v4：商品列表、承诺条、结算栏、猜你喜欢**四种分区全用线划界**，唯一的实色 CTA
     还被 `.go[disabled]` 涂成灰盒 ⇒ 整页读起来是一张平铺的表，眼睛没有落点。
     v5：把**结算栏**这一处升格为分区级的「面」（全页唯一一次），主 CTA 回到实底主色，
     勾选框显示真实状态。列表区的线**一条都没动** —— 那是「分组用线」，本来就对。
   ⚠️ 一句话检验（与搜索页同一把尺）：**v4 整页调成灰度，「合计 ¥475.70」与「去结算」
     不比周围任何一根发丝线更重；v5 的结算栏是一条明确的带。**
     这是这一版真正买到的东西 —— 不是「加了绿色」，是「加了**一个**重心」。

  ── 参考：淘宝 / 京东购物车（按店铺分组 + 店铺小计 + 底部吸底结算栏）、
     Zalando 购物袋（无订单号、单栏、底部固定结算带）。
  ═══════════════════════════════════════════════════════════════════════════════
-->

   ㈡ slot 改右对齐（向左生长，不再出页）；future 抬到 top:-28（y 172–189），

   理由三（为什么是**这一枚色**）：`--glaze-deep`(#dbe3de) ΔE00/白 = **8.01**、OKLCH C=0.011 H=159°
     —— 是本批 token 里**唯一**同时满足「ΔE00/白 ≥ 4（看得见）」与「彩度低到还像釉」的中性面
     （`--zone` 2.71 / `--surface-2` 2.63 / `--glaze-pale` 2.91 全在「看得见」线以下）。
   理由四（**一致性**）：它与登录页的品牌栏、个人页的身份卡用的是**同一枚** `--glaze-deep`
     ⇒ 全批形成一条可复述的语言：「**每页一个釉面主块，只用一次**」。
   面积代价：约 1440×80 ≈ 全页 **3.2%** —— 换到一个真实的分区面，不违反「克制 > 堆砌」。
   ⚠️ 删 `border-top` 是四层语法的要求：这一层已经是**分区**了，分区用「面」划界；
     面之外再叠一根线，就是同一种手段跨层级复用（线是留给「分组」的）。 */
.paybar{position:sticky;bottom:0;z-index:20;background:var(--glaze-deep)}
.paybar-in{max-width:1180px;margin:0 auto;padding:var(--s4) var(--s5);
           display:flex;align-items:center;gap:var(--s5)}
.paybar .sel{display:flex;align-items:center;gap:var(--s3);font-size:var(--fs-sm);color:var(--ink-2)}
.paybar .sel .cnt{color:var(--ink-3);font-size:var(--fs-xs);font-variant-numeric:tabular-nums}
.paybar .sums{margin-left:auto;display:flex;align-items:baseline;gap:var(--s4)}
.paybar .sums .d{font-size:var(--fs-xs);color:var(--ink-3);font-variant-numeric:tabular-nums}
.total{display:flex;align-items:baseline;gap:var(--s2)}
.total .k{font-size:var(--fs-sm);color:var(--ink-2)}
.total .v{font-family:var(--font-display);font-size:var(--fs-xl);font-weight:var(--fw-med);
          line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.total .v i{font-style:normal;font-size:var(--fs-sm);margin-right:2px}
.go{height:48px;padding:0 var(--s7);border-radius:var(--r2);background:var(--brand);
    color:var(--bg);font-size:var(--fs-md);font-weight:var(--fw-med);white-space:nowrap}
/* ⚠️ v5：**推翻**原来那条 `.go[disabled]{background:var(--surface-3);color:var(--ink-3)}`。
   原写法把全页最重要的行动按钮涂成一个灰盒 —— 而本页其余一切恰好都在证明它是活的：
   7 件已选、合计 ¥475.70、旁边就写着「去结算（7 件）」。灰盒读起来像「这单出问题了」。
   推翻的**依据是本文件自己的房规**（见头注第 88 行）：
     「逐行的重复控件一律**只 `disabled` + `title`**」——
   全批 `[disabled]` 也几乎都只改 cursor（`GoodsSelect` 的 `.sort`/`.pick`、`ProductPage` 的
   `.ghost`、`UserCenter` 的 `.tiles`/`.sec-h`）。`.go[disabled]` 是**全批唯一的例外**。
   ⇒ 改回房规：保留 `--brand` 实底（目标态长什么样就画什么样），
      「无端点」这一事实由 `disabled` 属性 + `title`（「结算流程无端点」）+ `cursor:not-allowed` 承担。
   ⚠️ 底色从原来的 `--surface-3` 换成 `--brand`：在 `--glaze-deep` 面上，
      ΔE00(`--brand`, `--glaze-deep`) = **37.72**，按钮与面分得很开，不会糊在一起。 */
.go[disabled]{background:var(--brand);color:var(--bg);cursor:not-allowed}

/* ── 空态 ─────────────────────────────────────────────────────────────────── */
.empty{padding:var(--s8) 0;text-align:center}
.empty .big{font-family:var(--font-display);font-size:var(--fs-lg);color:var(--ink-2)}
.empty .p{margin-top:var(--s3);font-size:var(--fs-sm);color:var(--ink-3)}
.empty .go2{display:inline-block;margin-top:var(--s5);height:40px;line-height:40px;padding:0 var(--s6);
            border:1px solid var(--line-2);border-radius:var(--r2);color:var(--ink-2);font-size:var(--fs-sm)}

/* ── 窄屏：列头隐藏 ⇒ 每个字段自带小标签；吸底条折两行 ───────────────────────
   ⚠️ 四列 × 三行的**显式定位**，不用 grid-template-areas：列头一没，四件元信息若还各占
      一整行，末尾的「删除」会被推到很远、中间空出一大片（v2 首版就是这样）。
      两两一行（单价|删除 / 数量|小计）把这一带收在名字下方。 */
@media (max-width:1120px){
  .list-head{display:none}
  .row{grid-template-columns:28px 64px minmax(0,1fr) auto;
       column-gap:var(--s5);row-gap:var(--s4);align-items:center}
  .row .ck{grid-area:1/1/2/2;align-self:start;margin-top:2px}
  .row .thumb{grid-area:1/2/2/3}
  .row .nm{grid-area:1/3/2/5}
  .row .unit{grid-area:2/3/3/4;text-align:left;font-size:var(--fs-xs)}
  .row .op{grid-area:2/4/3/5;text-align:right}
  .row .qty{grid-area:3/3/4/4;justify-content:flex-start}
  .row .sub{grid-area:3/4/4/5}
  /* 列头没了，所以这几个数各自带一个前缀标签 —— 只在窄屏出现，不是装饰 */
  .row .unit::before{content:"单价 "}
  .row .sub::before{content:"小计 ";font-family:var(--font);font-size:var(--fs-xs);
                    font-weight:var(--fw-reg);color:var(--ink-3)}
  .row .qty::before{content:"数量";color:var(--ink-3);font-size:var(--fs-xs)}
  .pledge{gap:var(--s5)}
  /* 吸底条折两行，**不靠 flex-wrap**（折行位置随视口变，GoodsUp 踩过） */
  .paybar-in{flex-direction:column;align-items:stretch;gap:var(--s3)}
  .paybar .sums{margin-left:0;justify-content:space-between}
  .go{width:100%;padding:0}
}
</style>
</head>
<body>

<div class="bar">
  <span class="bar-t">B 稿 v5 · 购物车（客户） <em>目标版 · 后端零购物车端点</em></span>
  <button data-page="filled" class="on">有商品</button>
  <button data-page="empty">空购物车</button>
  <span class="sep"></span>
  <button id="slotBtn">显示预留位 / 目标版</button>
  <span class="hint">预览稿 · 项目源码未动</span>
</div>

<!-- ═══════════ 一、有商品 ═══════════ -->
<section class="page on" data-page="filled">
  <nav class="nav-bar">
    <a class="brand">商城主页</a>
    <div class="nav-right"><a>消息<i class="dot"></i></a><a class="on">购物车</a><a>用户中心</a></div>
  </nav>
  <div class="wrap">
    <nav class="crumb"><a>首页</a><span class="sp">/</span><span class="cur">购物车</span></nav>

    <div class="h1row">
      <h1 class="page-h">购物车 <span class="n" id="h1n"></span></h1>
      <button class="edit" disabled
              data-slot="预留 · 编辑（动现有代码 4 处 · 超档）" data-future="待 C3〈购物车〉"
              title="待 C3〈购物车〉——批量删 / 移入收藏均无端点。4 处 = 购物车的共同基线（mall_management_sql.sql 建 cart 表 + CartController.java + endpoints.js + ShoppingCart.vue），**超档**，因清单点名而画出">编辑</button>
    </div>

    <!-- ── 店铺分组 + 商品行 + 店铺小计 ─────────────────────────────────── -->
    <section class="shops" data-slot="预留 · 店铺分组 / 商品行 / 店铺小计（动现有代码 4 处 · 超档）"
             data-future="待 C3〈购物车〉"
             title="待 C3〈购物车〉——整块 4 处 = 共同基线（mall_management_sql.sql 建 cart 表 + CartController.java + endpoints.js + ShoppingCart.vue）。分组键用 goods.MerchantId（**已有**，不用加列）；店铺名与「进店逛逛」另有缺口：无店铺表 ⇒ ≥5 处。**超档**，因清单点名而画出">
      <div class="list-head">
        <span></span><span></span><span>商品</span>
        <span class="c-num">单价</span><span class="c-num">数量</span>
        <span class="c-sub">小计</span><span class="c-op">操作</span>
      </div>
      <div id="shops"></div>
    </section>

    <!-- ── 服务承诺条（跨页共性组件）───────────────────────────────────── -->
    <div class="pledge" data-slot="预留 · 服务承诺条（动现有代码 ≥4 处 · 超档）" data-future="待 C3〈商品〉"
         title="待 C3〈商品〉——goods 无承诺列，选了什么存不下来：mall_management_sql.sql + GoodsDao.java + GoodsController.java + 上架页 = ≥4 处，**超档**。⚠️ 文案必须与 ProductPage.html 的承诺条逐字一致（跨页共性组件）">
      <span>正品保障</span><span>7 天无理由</span><span>极速退款</span><span>运费险</span>
    </div>

    <!-- ── 猜你喜欢（真功能：goodsSelectHome 现成，0 处改动）─────────────── -->
    <section class="rec">
      <div class="rec-h">
        <h2>猜你喜欢</h2>
        <span class="note">goodsSelectHome · 现有端点，0 处改动</span>
      </div>
      <div class="grid" id="rec-filled"></div>
    </section>
  </div>

  <!-- ── 吸底结算栏 ───────────────────────────────────────────────────── -->
  <div class="paybar" data-slot="预留 · 吸底结算栏（动现有代码 4 处 · 超档）" data-future="待 C3〈购物车〉"
       title="待 C3〈购物车〉——结算 / 支付流程均无端点。4 处 = 共同基线（mall_management_sql.sql 建 cart 表 + CartController.java + endpoints.js + ShoppingCart.vue），**超档**，因清单点名而画出">
    <div class="paybar-in">
      <span class="sel">
        <button class="ck on" disabled title="待 C3〈购物车〉——全选无端点"></button>
        全选
        <span class="cnt" id="barCnt"></span>
      </span>
      <span class="sums">
        <span class="d" id="barGoods"></span>
        <span class="total"><span class="k">合计</span><span class="v"><i>¥</i><span id="barTotal"></span></span></span>
      </span>
      <button class="go" disabled id="goBtn" title="待 C3〈购物车〉——结算流程无端点"></button>
    </div>
  </div>
</section>

<!-- ═══════════ 二、空购物车 ═══════════ -->
<section class="page" data-page="empty">
  <nav class="nav-bar">
    <a class="brand">商城主页</a>
    <div class="nav-right"><a>消息<i class="dot"></i></a><a class="on">购物车</a><a>用户中心</a></div>
  </nav>
  <div class="wrap">
    <nav class="crumb"><a>首页</a><span class="sp">/</span><span class="cur">购物车</span></nav>
    <div class="h1row">
      <h1 class="page-h">购物车 <span class="n">0 件商品</span></h1>
    </div>
    <!-- ⚠️ 空购物车时**既不画吸底结算栏，也不画服务承诺条**：
         没有商品可结算，也没有商品可承诺 —— 承诺条在这一态下**没有指代对象**，
         悬在空态与推荐区之间只会被读成「空态的附属小字」。
         真实平台的空购物车就是「空态 + 去逛逛 + 猜你喜欢」三件，见 Q3 第 ⑨ 条。 -->
    <div class="empty">
      <div class="big">购物车还是空的</div>
      <div class="p">逛逛商品，把想买的先放进来。</div>
      <a class="go2">去挑商品</a>
    </div>

    <section class="rec">
      <div class="rec-h">
        <h2>猜你喜欢</h2>
        <span class="note">goodsSelectHome · 现有端点，0 处改动</span>
      </div>
      <div class="grid" id="rec-empty"></div>
    </section>
  </div>
</section>

<script>
/* ⚠️ 本段整体是一个 **JS 模板字符串** ⇒ 里面的 HTML 注释**不许出现反引号**
   （ProductPage 踩过：一个反引号提前截断字符串 ⇒ 整页白屏）。 */

/* ── 按店铺分组的商品行 ────────────────────────────────────────────────────
   ⚠️ 名称 / 规格 / 店铺名均为**示意** —— order 实体只有 ProductInformation 一个商品文本列，
     更没有店铺表。分组键（MerchantId）本身是既有字段，但**店铺名没有来源**。
   [店铺名, [[名称, 规格, 单价, 数量], …]]
   ─────────────────────────────────────────────────────────────────────── */
const SHOPS = [
  ['声谷数码 · 官方店', [
    ['无线蓝牙耳机 声谷标准版', '标准款 · 深空灰', 129.00, 1],
    ['便携充电宝 20000mAh',   '容量 20000 · 白',  149.00, 1]
  ]],
  ['暖屋生活馆', [
    ['不锈钢保温杯 500ml',   '磨砂银 · 500ml',    69.00, 2],
    ['有机全麦面包 每日鲜',   '全麦 · 6 片装',     19.90, 3]
  ]]
]

const yuan = n => n.toFixed(2)

const rowHTML = ([name, spec, unit, qty]) => `
  <div class="row">
    <button class="ck on" disabled title="待 C3〈购物车〉——勾选无端点（共同基线 4 处，超档）"></button>
    <div class="thumb"></div>
    <div class="nm">
      <div class="t">${name}</div>
      <div class="spec">规格：${spec}</div>
    </div>
    <div class="unit">¥${yuan(unit)}</div>
    <div class="qty">
      <button class="b" disabled title="待 C3〈购物车〉——数量递减无端点（共同基线 4 处，超档）">−</button>
      <span class="v">${qty}</span>
      <button class="b" disabled title="待 C3〈购物车〉——数量递增无端点（共同基线 4 处，超档）">+</button>
    </div>
    <div class="sub">¥${yuan(unit * qty)}</div>
    <div class="op"><button disabled title="待 C3〈购物车〉——删除无端点（共同基线 4 处，超档）">删除</button></div>
  </div>`

document.getElementById('shops').innerHTML = SHOPS.map(([shop, rows]) => {
  const sub = rows.reduce((s, r) => s + r[2] * r[3], 0)
  const cnt = rows.reduce((s, r) => s + r[3], 0)
  return `
  <div class="shop">
    <div class="shop-head">
      <button class="ck on" disabled title="待 C3〈购物车〉——全选本店无端点（共同基线 4 处，超档）"></button>
      <span class="shop-nm">${shop}<span class="badge">${cnt} 件</span></span>
      <a class="visit" title="待 C3〈店铺〉——无店铺表，无落点（≥5 处，超档；与 ProductPage.html 的商家卡同一缺口）">进店逛逛 ›</a>
    </div>
    ${rows.map(rowHTML).join('')}
    <div class="shop-foot">
      本店小计
      <span class="v">¥${yuan(sub)}</span>
    </div>
  </div>`
}).join('')

/* ── 标题与吸底结算栏的数字**全部由 SHOPS 算出来**，不写死 ────────────────────
   ⚠️ 第一版这里写死了「6 件 / ¥326.70」（v2 那组残留数据），而 SHOPS 实际是
      7 件 / ¥475.70（278.00 + 197.70）——**评审一眼就能加出来对不上**。
      教训：页面上凡是「另一个数算得出来」的数，都不许手写。 */
{
  const all = SHOPS.flatMap(s => s[1])
  const cnt = all.reduce((s, r) => s + r[3], 0)
  const total = all.reduce((s, r) => s + r[2] * r[3], 0)
  document.getElementById('h1n').textContent = cnt + ' 件商品 · ' + SHOPS.length + ' 家店铺'
  document.getElementById('barCnt').textContent = '已选 ' + cnt + ' 件 / 共 ' + cnt + ' 件'
  document.getElementById('barGoods').textContent = '商品总额 ¥' + yuan(total) + ' · 运费 免运费'
  document.getElementById('barTotal').textContent = yuan(total)
  document.getElementById('goBtn').textContent = '去结算（' + cnt + ' 件）'
  console.log('[cart] 店铺', SHOPS.length, '件数', cnt, '合计', yuan(total))
}

/* ── 猜你喜欢：商品卡与 GoodsSelect / ProductPage / UserCenter-customer **逐字同款** ──
   ⚠️ 条数必须**同时整除 4 列和 5 列**，否则末行残缺：
      第一版 6 条 ⇒ 1440 下 5 列排成 5+1，那个孤卡一眼就不对劲；
      第二版 10 条 ⇒ 1440（5 列）好了，1080（4 列）又成 4+4+2。
      实测列数：1440 → 内容 1132px → 5 列；1080 → 内容 1032px → 4 列。
      **20 = 4 和 5 的公倍数** ⇒ 两种宽度下都是整行（5×4 / 4×5）。
      ⚠️ 真实平台的猜你喜欢是**无限流**，末行残缺本身正常；这里是要给 D 笔一个
         「栅格填满」的视觉锚点，残缺行会被误读成布局出错。 */
const REC = [
  ['机械键盘 静音红轴', 359.00], ['天然乳胶枕 护颈款', 199.00],
  ['冷萃咖啡液 十二瓶装', 88.00], ['折叠雨伞 全自动款', 59.00],
  ['陶瓷马克杯 350ml', 29.90], ['桌面收纳盒 三层抽屉', 45.00],
  ['纯棉毛巾 三条装', 39.00], ['护眼台灯 无极调光', 129.00],
  ['帆布托特包 大容量', 79.00], ['香薰蜡烛 雪松木质调', 68.00],
  ['便携折叠水壶 600ml', 49.00], ['羊毛混纺围巾', 159.00],
  ['桌面理线器 五个装', 19.90], ['蓝牙音箱 迷你款', 229.00],
  ['陶瓷餐具四件套', 199.00], ['记忆棉坐垫', 89.00],
  ['旅行收纳袋 六件装', 65.00], ['木质相框 六寸', 35.00],
  ['不锈钢餐具三件套', 55.00], ['靠枕套 四十五厘米', 42.00]
]
const cardHTML = ([name, p]) => {
  const [i, d] = p.toFixed(2).split('.')
  return '<a class="card"><div class="thumb2"></div><div class="c-name">' + name + '</div>' +
    '<div class="c-price"><span class="sym">¥</span><span class="int">' + i + '</span>' +
    '<span class="dec">.' + d + '</span></div></a>'
}
document.getElementById('rec-filled').innerHTML = REC.map(cardHTML).join('')
document.getElementById('rec-empty').innerHTML = REC.map(cardHTML).join('')

/* ── 切页 ─────────────────────────────────────────────────────────────────── */
const bar = document.querySelector('.bar')
function go(key) {
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('on', p.dataset.page === key))
  bar.querySelectorAll('button[data-page]').forEach(b => b.classList.toggle('on', b.dataset.page === key))
  window.scrollTo(0, 0)
}
bar.querySelectorAll('button[data-page]').forEach(b => b.addEventListener('click', () => go(b.dataset.page)))

/* ── 预留位 / 目标版 开关 —— 默认关闭 ─────────────────────────────────────── */
const slotBtn = document.getElementById('slotBtn')
slotBtn.addEventListener('click', () => {
  const on = document.body.classList.toggle('slots')
  slotBtn.classList.toggle('on', on)
  slotBtn.textContent = on ? '隐藏预留位 / 目标版' : '显示预留位 / 目标版'
})
</script>
</body>
</html>
